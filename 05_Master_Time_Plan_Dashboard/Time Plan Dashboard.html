v style=\"flex:1\">\n              <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">End week<\u002Flabel>\n              <input type=\"number\" value=\"{{ editPopup.endWk }}\" sc-camel-on-change=\"{{ onEditEndWk }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px\">\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">End year<\u002Flabel>\n              <input type=\"number\" value=\"{{ editPopup.endYr }}\" sc-camel-on-change=\"{{ onEditEndYr }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ editPopup.error }}\">\n            <div style=\"font-size:11px;color:#B3261E;margin-bottom:8px\">{{ editPopup.error }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:12px\">\n            <button sc-camel-on-click=\"{{ closeEditPopup }}\" style=\"padding:7px 14px;border:1px solid #D8D4CB;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:#767267\">Cancel<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goToDetailsStep }}\" style=\"padding:7px 14px;border:none;border-radius:6px;background:#1F2430;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer\">Next<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ editPopupIsDetails }}\">\n          <div style=\"font-size:11.5px;color:#767267;margin-bottom:14px\">Step 2 of 2 · Update details (optional)<\u002Fdiv>\n          <div style=\"margin-bottom:10px\">\n            <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">Activity name<\u002Flabel>\n            <input type=\"text\" value=\"{{ editPopup.activity }}\" sc-camel-on-change=\"{{ onEditActivityName }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px;box-sizing:border-box\">\n          <\u002Fdiv>\n          <div style=\"margin-bottom:10px\">\n            <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">Status<\u002Flabel>\n            <sc-raw-select value=\"{{ editPopup.status }}\" sc-camel-on-change=\"{{ onEditStatus }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px;box-sizing:border-box;background:#fff\">\n              <sc-for list=\"{{ statusOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <option value=\"{{ opt }}\">{{ opt }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:6px\">\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">Responsible<\u002Flabel>\n              <input type=\"text\" value=\"{{ editPopup.responsible }}\" sc-camel-on-change=\"{{ onEditResponsible }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px;box-sizing:border-box\">\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">Location<\u002Flabel>\n              <input type=\"text\" value=\"{{ editPopup.location }}\" sc-camel-on-change=\"{{ onEditLocation }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px;box-sizing:border-box\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ editPopup.error }}\">\n            <div style=\"font-size:11px;color:#B3261E;margin-bottom:8px\">{{ editPopup.error }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:12px\">\n            <button sc-camel-on-click=\"{{ skipDetailsStep }}\" style=\"padding:7px 14px;border:1px solid #D8D4CB;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:#767267\">Skip<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ applyDetailsStep }}\" style=\"padding:7px 14px;border:none;border-radius:6px;background:#1F2430;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer\">OK<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ notLoaded }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:40px\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drop=\"{{ onDropFile }}\">\n      <div style=\"max-width:520px;text-align:left;padding:34px 38px;border:2px dashed #D8D4CB;border-radius:12px;background:#FFFFFF\">\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:8px;color:#1F2430\">Load your timeplan files<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#767267;line-height:1.65\">Use <strong>Load folder<\u002Fstrong> to point at the folder your timeplan owners save into, or drag every <code>.xlsx<\u002Fcode> onto this box. Each file is one timeplan.<\u002Fdiv>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #EDEBE4;font-size:12px;color:#4A473F;line-height:1.7\">\n          <div style=\"font-weight:700;margin-bottom:4px\">Naming rule<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#1F2430\">L1_Project.xlsx &nbsp; L2_Component.xlsx &nbsp; L2_Assembly.xlsx &nbsp; L3_Tooling.xlsx<\u002Fdiv>\n          <div style=\"margin-top:6px;color:#767267\">The leading <strong>L1…L5<\u002Fstrong> sets the stacking order (L1 on top). Files at the same level are ordered alphabetically by the word after the level. Several files may share a level.<\u002Fdiv>\n          <div style=\"font-weight:700;margin:12px 0 4px\">Dependencies<\u002Fdiv>\n          <div style=\"color:#767267\">Write them as <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#1F2430\">L1_Project-14<\u002Fspan> — file name, a hyphen, then the No. of the activity it waits for. Several separated by <b>;<\u002Fb>. The activity name works instead of the No.; a bare No. or name means “in this same file”.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:11.5px;color:#9A968C\">Everything is parsed and rendered locally in your browser — nothing leaves your machine, and it works fully offline.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;comfortable&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;showCurrentWeekMarker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#000000&quot;,&quot;options&quot;:[&quot;#000000&quot;,&quot;#2E5C8A&quot;,&quot;#3E7CB1&quot;,&quot;#1F3864&quot;,&quot;#52789C&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;saveNaming&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;inPlace&quot;,&quot;options&quot;:[&quot;inPlace&quot;,&quot;suffix&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Saving&quot;},&quot;strictFileNames&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Warnings&quot;},&quot;staleDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:1,&quot;max&quot;:180,&quot;unit&quot;:&quot;days&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Warnings&quot;}}\">\nconst LEVEL_COLORS = ['#1F3864','#9A3412','#166534','#5B21B6','#155E75','#7C2D12','#3F3F46','#831843','#0F766E'];\n\nconst STATUS_STYLES = {\n  'TBD':        {bg:'#EAECEE', fg:'#5D6D7E', bold:false, italic:true},\n  'Planned':    {bg:'#D6EAF8', fg:'#1A5276', bold:false, italic:false},\n  'Aligned':    {bg:'#D1F2EB', fg:'#117864', bold:false, italic:false},\n  'Dependency': {bg:'#FCF3CF', fg:'#9A7D0A', bold:false, italic:true},\n  'Risk':       {bg:'#FAE5D3', fg:'#B9770E', bold:true,  italic:false},\n  'Blocker':    {bg:'#E74C3C', fg:'#FFFFFF', bold:true,  italic:false},\n  'Completed':  {bg:'#D5F5E3', fg:'#1E8449', bold:true,  italic:false},\n};\nconst DEFAULT_STATUS_STYLE = {bg:'#F4F3EF', fg:'#767267', bold:false, italic:false};\n\nconst PALETTE_FALLBACK = ['4472C4','ED7D31','70AD47','FFC000','FF6B6B','9B59B6','00BCD4','E74B3B','2ECC71','F39C12',\n  '5B9BD5','A9D18E','E91E63','1ABC9C','3498DB','7030A0','00B0F0','FF0000','92D050','4BACC6',\n  'C55A11','4A8136','843C0C','2E75B6','833C00','BF8E00','375623','1F3864','C00000','2C5494',\n  'F4B183','A9D18E','FF99CC','D6DEE9','B4C6E7','FFD966','C9C9C9','70AD47','ED7D31','4472C4',\n  '7030A0','FF6B6B','00BCD4','2ECC71','F39C12','E74B3B','9B59B6','3498DB','5B9BD5','4472C4'].map(h=>'#'+h);\n\nfunction mixHex(hex, other, t){\n  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];\n  const a = p(hex), b = p(other);\n  const c = a.map((v,i)=> Math.round(v + (b[i]-v)*t));\n  return '#' + c.map(v=>v.toString(16).padStart(2,'0')).join('');\n}\n// Several files can sit at the same level (two L2s), so the 2nd, 3rd… plan of a level\n// gets a progressively lighter tint of that level's colour to stay tellable apart.\nfunction levelColor(level, dupIndex){\n  const base = LEVEL_COLORS[(Math.max(1,level)-1) % LEVEL_COLORS.length];\n  return dupIndex ? mixHex(base, '#FFFFFF', Math.min(0.5, dupIndex*0.17)) : base;\n}\n\nfunction decodeXmlEntities(s){\n  return s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))\n          .replace(/&#(\\d+);/g,(_,d)=>String.fromCodePoint(parseInt(d,10)))\n          .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'\"').replace(/&apos;/g,\"'\").replace(/&amp;/g,'&');\n}\n\nasync function inflateRaw(bytes){\n  if(typeof DecompressionStream==='undefined') throw new Error('Your browser does not support offline unzip (DecompressionStream). Use a recent Chrome, Edge, or Firefox.');\n  const ds = new DecompressionStream('deflate-raw');\n  const stream = new Blob([bytes]).stream().pipeThrough(ds);\n  const buf = await new Response(stream).arrayBuffer();\n  return new Uint8Array(buf);\n}\nfunction readU16(dv,o){ return dv.getUint16(o,true); }\nfunction readU32(dv,o){ return dv.getUint32(o,true); }\nasync function unzip(ab){\n  const bytes = new Uint8Array(ab);\n  const dv = new DataView(ab);\n  let eocd=-1;\n  for(let i=bytes.length-22;i>=0 && i> bytes.length-22-65557;i--){\n    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }\n  }\n  if(eocd<0) throw new Error('Not a valid .xlsx file (zip end marker not found).');\n  const cdOffset = readU32(dv,eocd+16);\n  const cdCount = readU16(dv,eocd+10);\n  let p = cdOffset;\n  const entries = {};\n  for(let i=0;i<cdCount;i++){\n    const method = readU16(dv,p+10);\n    const compSize = readU32(dv,p+20);\n    const fnLen = readU16(dv,p+28);\n    const extraLen = readU16(dv,p+30);\n    const commentLen = readU16(dv,p+32);\n    const localOffset = readU32(dv,p+42);\n    const name = new TextDecoder().decode(bytes.slice(p+46,p+46+fnLen));\n    entries[name] = {method,compSize,localOffset};\n    p += 46+fnLen+extraLen+commentLen;\n  }\n  return {bytes,dv,entries};\n}\nasync function extractFile(zip, name){\n  const e = zip.entries[name];\n  if(!e) return null;\n  const dv = zip.dv;\n  const lp = e.localOffset;\n  const fnLen = readU16(dv, lp+26);\n  const extraLen = readU16(dv, lp+28);\n  const dataStart = lp+30+fnLen+extraLen;\n  const compData = zip.bytes.slice(dataStart, dataStart+e.compSize);\n  const out = e.method===0 ? compData : await inflateRaw(compData);\n  return new TextDecoder('utf-8').decode(out);\n}\n\nfunction extractRunsText(inner){\n  let out = '';\n  const re = /<t[^>]*>([\\s\\S]*?)<\\/t>/g;\n  let m;\n  while((m = re.exec(inner))){ out += m[1]; }\n  return decodeXmlEntities(out);\n}\nfunction parseSharedStrings(xml){\n  if(!xml) return [];\n  const items = [];\n  const re = /<si\\b[^>]*>([\\s\\S]*?)<\\/si>/g;\n  let m;\n  while((m = re.exec(xml))){ items.push(extractRunsText(m[1])); }\n  return items;\n}\nfunction parseCells(xml, sharedStrings){\n  sharedStrings = sharedStrings || [];\n  const cells = {};\n  const re = /<c r=\"([A-Za-z]+)(\\d+)\"([^>]*?)(?:\\/>|>([\\s\\S]*?)<\\/c>)/g;\n  let m;\n  while((m = re.exec(xml))){\n    const ref = m[1]+m[2];\n    const attrs = m[3]||'';\n    const inner = m[4]||'';\n    const tMatch = attrs.match(/\\bt=\"([^\"]+)\"/);\n    const sMatch = attrs.match(/\\bs=\"(\\d+)\"/);\n    const type = tMatch ? tMatch[1] : 'n';\n    let value = null;\n    if(type==='inlineStr'){\n      const ism = inner.match(/<is>([\\s\\S]*?)<\\/is>/);\n      value = extractRunsText(ism ? ism[1] : inner);\n    } else if(type==='s'){\n      const vm = inner.match(/<v>([\\s\\S]*?)<\\/v>/);\n      const idx = vm ? Number(decodeXmlEntities(vm[1])) : NaN;\n      value = Number.isFinite(idx) ? (sharedStrings[idx] ?? '') : '';\n    } else {\n      const vm = inner.match(/<v>([\\s\\S]*?)<\\/v>/);\n      if(vm){\n        const raw = decodeXmlEntities(vm[1]);\n        value = (type==='str') ? raw : (raw==='' ? null : Number(raw));\n      }\n    }\n    cells[ref] = {value, type, style: sMatch ? Number(sMatch[1]) : 0};\n  }\n  return cells;\n}\n\nfunction parseStyles(xml){\n  const fillsBlock = (xml.match(/<fills[^>]*>([\\s\\S]*?)<\\/fills>/)||[])[1] || '';\n  const fillTags = fillsBlock.match(/<fill>[\\s\\S]*?<\\/fill>/g) || [];\n  const fillColors = fillTags.map(f=>{\n    const fg = f.match(/<fgColor rgb=\"([0-9A-Fa-f]{6,8})\"/);\n    return fg ? '#'+fg[1].slice(-6) : null;\n  });\n  const cellXfsBlock = (xml.match(/<cellXfs[^>]*>([\\s\\S]*?)<\\/cellXfs>/)||[])[1] || '';\n  const xfTags = cellXfsBlock.match(/<xf\\b[^>]*?(?:\\/>|>[\\s\\S]*?<\\/xf>)/g) || [];\n  const xfFill = xfTags.map(x=>{\n    const fm = x.match(/fillId=\"(\\d+)\"/);\n    return fm ? Number(fm[1]) : 0;\n  });\n  return {fillColors, xfFill};\n}\nfunction getCellColor(cells, ref, stylesInfo, fallback){\n  const c = cells[ref];\n  if(!c) return fallback;\n  const fillId = stylesInfo.xfFill[c.style] ?? 0;\n  const color = stylesInfo.fillColors[fillId];\n  return color || fallback;\n}\n\nconst HEADER_ALIASES = {\n  'no.':'no', 'no':'no', '#':'no',\n  'activity / event':'activity', 'activity/event':'activity', 'activity':'activity', 'event':'activity',\n  'responsible':'responsible', 'owner':'responsible',\n  'location':'location', 'site':'location',\n  'start wk':'startWk', 'startwk':'startWk', 'start week':'startWk',\n  'start yr':'startYr', 'startyr':'startYr', 'start year':'startYr',\n  'end wk':'endWk', 'endwk':'endWk', 'end week':'endWk',\n  'end yr':'endYr', 'endyr':'endYr', 'end year':'endYr',\n  'tracker':'tracker',\n  'status':'status',\n  'comments / notes':'comments', 'comments':'comments', 'notes':'comments',\n  'dependencies':'dependencies', 'depends on':'dependencies',\n};\nconst DEFAULT_LAYOUT = {\n  headerRow: 6, firstDataRow: 7,\n  cols: {no:'D', activity:'E', responsible:'F', location:'G', startWk:'H', startYr:'I',\n    endWk:'J', endYr:'K', tracker:'L', status:'M', comments:'N', dependencies:'O'},\n};\nfunction normHeader(v){ return String(v==null?'':v).replace(/\\s+/g,' ').trim().toLowerCase(); }\nfunction colNumToLetter(n){\n  let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-m-1)/26); }\n  return s;\n}\nfunction weekLabel(wk, yr){\n  if(!wk || !yr) return '\\u2014';\n  return 'W'+wk+\" '\"+String(yr).slice(-2);\n}\nfunction detectLayout(cells){\n  let headerRow = null;\n  for(const ref in cells){\n    if(HEADER_ALIASES[normHeader(cells[ref].value)] === 'activity'){\n      const m = /^([A-Z]+)(\\d+)$/.exec(ref);\n      if(m && (headerRow===null || Number(m[2])<headerRow)) headerRow = Number(m[2]);\n    }\n  }\n  if(headerRow===null) return DEFAULT_LAYOUT;\n  const cols = {};\n  for(const ref in cells){\n    const m = /^([A-Z]+)(\\d+)$/.exec(ref);\n    if(!m || Number(m[2])!==headerRow) continue;\n    const key = HEADER_ALIASES[normHeader(cells[ref].value)];\n    if(key && !cols[key]) cols[key] = m[1];\n  }\n  if(!cols.activity) return DEFAULT_LAYOUT;\n  for(const k in DEFAULT_LAYOUT.cols){ if(!cols[k]) cols[k] = DEFAULT_LAYOUT.cols[k]; }\n  return {headerRow, firstDataRow: headerRow+1, cols};\n}\n\nconst PLAN_NAME_LABEL_RE = /^(timeplan|time plan|plan)\\s*name$/;\nfunction detectPlanNameRef(cells, layout){\n  const lastHeaderRow = (layout && layout.headerRow ? layout.headerRow : 6) - 1;\n  for(const ref in cells){\n    const m = /^([A-Z]+)(\\d+)$/.exec(ref);\n    if(!m) continue;\n    const row = Number(m[2]);\n    if(row < 2 || row > lastHeaderRow) continue;\n    if(colLetterToNum(m[1]) > 4) continue;\n    const txt = String(cells[ref].value == null ? '' : cells[ref].value).trim().toLowerCase().replace(/\\s+/g,' ');\n    if(PLAN_NAME_LABEL_RE.test(txt)) return 'E'+row;\n  }\n  return 'E5';\n}\n\nconst APP_VERSION = 'Version 2.8';\n\n// ---- programme heading -------------------------------------------------------\n// The strip above the activity table is the heading for the whole master plan and for\n// every export. Reading it out of whichever file happens to be L1 is wrong when twelve\n// owners each type something different, so it is overridden and stored here instead.\nconst HDR_KEY = 'tpDashboardHeadingV1';\nconst HDR_FIELDS = [\n  {key:'title',       label:'Programme',      placeholder:'Programme / project name', w:'flex:2 1 260px'},\n  {key:'description', label:'Description',    placeholder:'One line of context',      w:'flex:2 1 260px'},\n  {key:'code',        label:'Programme code', placeholder:'e.g. DVP-2026',            w:'flex:1 1 130px'},\n  {key:'sop',         label:'SoP',            placeholder:'e.g. Wk 1, 2026',          w:'flex:1 1 130px'},\n  {key:'revision',    label:'Revision',       placeholder:'e.g. Rev C',               w:'flex:1 1 110px'},\n  {key:'issuedBy',    label:'Issued by',      placeholder:'Your name / team',         w:'flex:1 1 150px'},\n];\nfunction loadHeading(){\n  try { const raw = localStorage.getItem(HDR_KEY); return raw ? (JSON.parse(raw)||{}) : {}; } catch(e){ return {}; }\n}\nfunction saveHeading(h){\n  try { localStorage.setItem(HDR_KEY, JSON.stringify(h||{})); } catch(e){}\n}\nconst PLAN_ID_LABEL_RE = /^(plan\\s*id|planid|timeplan\\s*id)$/;\nconst LAST_UPDATED_LABEL_RE = /^(last\\s*updated|last\\s*update|updated|updated\\s*on)$/;\n// Same convention as the Timeplan Name cell: a label in the header block, its value in\n// the first non-empty cell to its right on the same row.\nfunction detectLabeledRef(cells, layout, re){\n  const lastHeaderRow = (layout && layout.headerRow ? layout.headerRow : 6) - 1;\n  for(const ref in cells){\n    const m = /^([A-Z]+)(\\d+)$/.exec(ref);\n    if(!m) continue;\n    const row = Number(m[2]);\n    if(row < 2 || row > lastHeaderRow) continue;\n    const col = colLetterToNum(m[1]);\n    if(col > 14) continue;\n    const txt = String(cells[ref].value == null ? '' : cells[ref].value).trim().toLowerCase().replace(/\\s+/g,' ');\n    if(!re.test(txt)) continue;\n    for(let c=col+1; c<=col+4; c++){\n      const r2 = colNumToLetter(c)+row;\n      if(cells[r2] && String(cells[r2].value==null?'':cells[r2].value).trim()!=='') return r2;\n    }\n    return colNumToLetter(col+1)+row;\n  }\n  return null;\n}\nfunction parseUpdatedValue(v){\n  if(v==null || v==='') return null;\n  const n = Number(v);\n  // Excel keeps dates as a serial number counted from 1899-12-30.\n  if(isFinite(n) && n>20000 && n<80000) return new Date(Date.UTC(1899,11,30) + Math.round(n)*86400000);\n  const s = String(v).trim();\n  const m = /^(\\d{4})[-/.](\\d{1,2})[-/.](\\d{1,2})/.exec(s);\n  if(m) return new Date(Date.UTC(Number(m[1]), Number(m[2])-1, Number(m[3])));\n  const d = new Date(s);\n  return isNaN(d.getTime()) ? null : d;\n}\nfunction daysSince(d){ return Math.floor((Date.now() - d.getTime())/86400000); }\n\n// ---- baselines ---------------------------------------------------------------\n// A baseline is a frozen copy of every activity's dates, written to _baselines/YYYY-MM.json\n// beside the timeplans. Comparing today's dates against it is what turns the dashboard\n// from \"where are we\" into \"what moved, and by how much\".\nconst BASELINE_DIR = '_baselines';\n// Where the version that is about to be overwritten is copied to. If the user has not\n// pointed at their own 04 folder, one of this name is made inside the timeplan folder.\nconst ARCHIVE_DIR = '04_Archived_Timeplans';\nconst absWeekCache = {};\nfunction absWeek(wk, yr){\n  const w = Number(wk), y = Number(yr);\n  if(!isFinite(w) || !isFinite(y)) return null;\n  if(absWeekCache[y]==null){\n    let base = 0;\n    for(let i=2000;i<y;i++) base += lastIsoWeek(i);\n    absWeekCache[y] = base;\n  }\n  return absWeekCache[y] + w;\n}\n// Baseline ids are \"YYYY-MM\" (legacy, one per month) or \"YYYY-MM_n\" (current — every\n// capture is kept, numbered within its month). Both render as \"August 2026\" / \"August 2026 · 2\".\nfunction monthLabel(id){\n  const m = /^(\\d{4})-(\\d{2})(?:_(\\d+))?$/.exec(String(id||''));\n  if(!m) return String(id||'');\n  const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];\n  return names[Number(m[2])-1]+' '+m[1]+(m[3] && Number(m[3])>1 ? (' \\u00b7 '+m[3]) : '');\n}\n// Lexicographic sort would put _10 before _9, so the sequence number is zero-padded.\nfunction baselineSortKey(id){\n  const m = /^(\\d{4})-(\\d{2})(?:_(\\d+))?$/.exec(String(id||''));\n  if(!m) return String(id||'');\n  return m[1]+'-'+m[2]+'_'+String(m[3]||1).padStart(4,'0');\n}\nfunction currentBaselineMonth(){\n  const d = new Date();\n  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');\n}\n// Never replaces an existing snapshot — the next capture in the same month becomes _2, _3, …\nfunction nextBaselineId(existing){\n  const base = currentBaselineMonth();\n  const re = new RegExp('^'+base+'(?:_(\\\\d+))?$');\n  let n = 0;\n  (existing||[]).forEach(b=>{\n    const m = re.exec(String((b&&b.id)||''));\n    if(m) n = Math.max(n, m[1] ? Number(m[1]) : 1);\n  });\n  return base+'_'+(n+1);\n}\nfunction buildBaseline(plans, id){\n  const out = {version:1, id, label: monthLabel(id), created: new Date().toISOString(), plans:{}};\n  (plans||[]).forEach(p=>{\n    const acts = {};\n    p.activities.forEach(a=>{\n      acts[String(a.no)] = {n: String(a.activity||''), sw:a.startWk??null, sy:a.startYr??null, ew:a.endWk??null, ey:a.endYr??null};\n    });\n    out.plans[depNameKey(p.key)] = {file:p.fileName, key:p.key, name: (p.meta && p.meta.planName) || p.sortName, acts};\n  });\n  return out;\n}\n// Plans are matched on Plan ID first and file name second, so a file rename between\n// baseline and today does not orphan the comparison.\nfunction baselinePlanEntry(baseline, plan){\n  if(!baseline || !baseline.plans) return null;\n  return baseline.plans[depNameKey(plan.key)]\n      || baseline.plans[depNameKey(plan.fileKey||'')]\n      || null;\n}\nfunction baselineActEntry(baseline, plan, act){\n  const bp = baselinePlanEntry(baseline, plan);\n  if(!bp || !bp.acts) return null;\n  return bp.acts[String(act.no)] || null;\n}\n// Slip is measured on the end date — that is the date a programme review cares about.\nfunction baselineSlip(base, eff){\n  if(!base) return null;\n  const b = absWeek(base.ew, base.ey), n = absWeek(eff.endWk, eff.endYr);\n  if(b==null || n==null) return null;\n  const bs = absWeek(base.sw, base.sy), ns = absWeek(eff.startWk, eff.startYr);\n  return {end: n-b, start: (bs!=null && ns!=null) ? ns-bs : null};\n}\nfunction slipText(n){ return n>0 ? ('+'+n+'w') : (n<0 ? (n+'w') : 'on plan'); }\n\n// ---- knock-on / impact analysis ---------------------------------------------\n// The arrows say \"B waits for A\". If A's end moves, everything downstream of A is\n// either already impossible (it starts before A now finishes) or has lost float.\n// This walks the successor graph and says which is which, and by how many weeks.\nfunction buildSuccessorMap(plans){\n  const succ = {};\n  (plans||[]).forEach(p=>p.activities.forEach(a=>{\n    (a.dependsOn||[]).forEach(dep=>{ (succ[dep] = succ[dep] || []).push(a.code); });\n  }));\n  return succ;\n}\nconst IMPACT_MAX_DEPTH = 8;\nfunction computeImpact(plans, changes, effDates){\n  const index = {}, planOf = {};\n  (plans||[]).forEach(p=>p.activities.forEach(a=>{ index[a.code]=a; planOf[a.code]=p; }));\n  const succ = buildSuccessorMap(plans);\n  const out = [];\n  (changes||[]).forEach(ch=>{\n    const localSeen = {};\n    const queue = [{code:ch.code, endAbs:ch.newEndAbs, depth:0, via:ch.display}];\n    while(queue.length){\n      const cur = queue.shift();\n      if(cur.depth >= IMPACT_MAX_DEPTH || cur.endAbs==null) continue;\n      (succ[cur.code]||[]).forEach(sc=>{\n        if(localSeen[sc]) return;\n        localSeen[sc] = 1;\n        const a = index[sc], p = planOf[sc];\n        if(!a || !p) return;\n        const d = effDates(a);\n        const sAbs = absWeek(d.startWk, d.startYr), eAbs = absWeek(d.endWk, d.endYr);\n        if(sAbs==null) return;\n        const slack = sAbs - cur.endAbs;           // weeks between predecessor end and this start\n        const mustMove = slack <= 0;\n        const shift = mustMove ? (1 - slack) : 0;  // move so it starts the week after its predecessor ends\n        out.push({\n          key: ch.code+'>'+sc+'@'+cur.depth,\n          triggerCode: ch.code, triggerDisplay: ch.display, triggerName: ch.name, triggerDelta: ch.delta,\n          code: sc, display: p.key+'-'+a.no, name: d.activity || a.activity,\n          planKey: p.key, planId: p.id, color: p.color, responsible: d.responsible || '',\n          depth: cur.depth + 1, via: cur.via,\n          startLabel: weekLabel(d.startWk, d.startYr), endLabel: weekLabel(d.endWk, d.endYr),\n          slack, mustMove, shift,\n          verdict: mustMove ? ('Must move '+shift+'w') : (slack<=2 ? ('Review \\u2014 only '+slack+'w float left') : (slack+'w float left')),\n          severity: mustMove ? 'must' : (slack<=2 ? 'review' : 'ok'),\n        });\n        queue.push({code:sc, endAbs: (eAbs==null?null:eAbs+shift), depth:cur.depth+1, via:p.key+'-'+a.no});\n      });\n    }\n  });\n  out.sort((a,b)=> (a.severity===b.severity ? (b.shift-a.shift) : (a.severity==='must'?-1:b.severity==='must'?1:a.severity==='review'?-1:1)));\n  return out;\n}\nfunction fmtDay(d){\n  const p2 = n=>String(n).padStart(2,'0');\n  return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());\n}\n\nfunction parseLevelSheet(xml, stylesInfo, sharedStrings){\n  const cells = parseCells(xml, sharedStrings);\n  const g = ref => cells[ref] ? cells[ref].value : undefined;\n  const layout = detectLayout(cells);\n  const C = layout.cols;\n  const colorCol = colNumToLetter(Math.max(1, colLetterToNum(C.no)-1));\n  const planNameRef = detectPlanNameRef(cells, layout);\n  const planIdRef = detectLabeledRef(cells, layout, PLAN_ID_LABEL_RE);\n  const updatedRef = detectLabeledRef(cells, layout, LAST_UPDATED_LABEL_RE);\n  const meta = {\n    projectName: g('E2') || '', code: g('E3') || '', sop: g('G3') || '', description: g('E4') || '',\n    planName: g(planNameRef) || '', planNameRef,\n    planId: planIdRef ? String(g(planIdRef)==null?'':g(planIdRef)).trim() : '', planIdRef,\n    updatedRaw: updatedRef ? g(updatedRef) : null, updatedRef,\n    startWk: Number(g('P3'))||null, startYr: Number(g('Q3'))||null, endWk: Number(g('R3'))||null, endYr: Number(g('S3'))||null,\n  };\n  const activities = [];\n  let emptyStreak = 0;\n  for(let r=layout.firstDataRow;r<=2000;r++){\n    const activity = g(C.activity+r);\n    if(!activity){\n      emptyStreak++;\n      // Tolerate blank spacer rows between blocks; only give up after a long run of\n      // nothing. Files with 200+ activities are normal, so never stop early on row count.\n      if(emptyStreak>80) break;\n      continue;\n    }\n    emptyStreak = 0;\n    activities.push({\n      no: g(C.no+r), activity, responsible: g(C.responsible+r)||'', location: g(C.location+r)||'', row: r,\n      startWk: Number(g(C.startWk+r))||null, startYr: Number(g(C.startYr+r))||null,\n      endWk: Number(g(C.endWk+r))||null, endYr: Number(g(C.endYr+r))||null,\n      status: g(C.status+r) || '',\n      comments: g(C.comments+r) || '',\n      dependsOnRaw: parseDependencies(C.dependencies ? g(C.dependencies+r) : undefined),\n      dependsOn: [],\n      color: getCellColor(cells, colorCol+r, stylesInfo, PALETTE_FALLBACK[(r-layout.firstDataRow)%PALETTE_FALLBACK.length]),\n    });\n  }\n  return {meta, activities, layout};\n}\n\n// ---- file naming ------------------------------------------------------------\n// \"L2_Component.xlsx\" -> {base:'L2_Component', level:2, name:'Component'}.\n// The leading L{n} is what ranks the plan in the master view; the word after it\n// breaks ties alphabetically between two plans on the same level.\nfunction parsePlanFileName(fileName){\n  const base = String(fileName||'').replace(/\\.xlsx$/i,'').replace(/^.*[\\\\/]/,'');\n  const m = /^\\s*L\\s*([1-9])\\s*(?:[_\\-\\s.]+([\\s\\S]*))?$/i.exec(base);\n  if(m) return {base: base.trim(), level: Number(m[1]), name: (m[2]||'').trim()};\n  return {base: base.trim(), level: null, name: base.trim()};\n}\nfunction slugId(s){\n  const t = String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');\n  return t || 'plan';\n}\n\nfunction getISOWeekYear(date){\n  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));\n  const day = (d.getUTCDay()+6)%7;\n  d.setUTCDate(d.getUTCDate()-day+3);\n  const firstThu = new Date(Date.UTC(d.getUTCFullYear(),0,4));\n  const fday = (firstThu.getUTCDay()+6)%7;\n  firstThu.setUTCDate(firstThu.getUTCDate()-fday+3);\n  const week = 1+Math.round((d-firstThu)/(7*86400000));\n  return {week, year:d.getUTCFullYear()};\n}\nfunction lastIsoWeek(year){ return getISOWeekYear(new Date(Date.UTC(year,11,28))).week; }\nfunction buildWeeks(startWk,startYr,endWk,endYr){\n  const weeks=[];\n  let wk=startWk, yr=startYr, guard=0;\n  const endEnc = endYr*100+endWk;\n  if(!startWk||!startYr||!endWk||!endYr || (startYr*100+startWk) > endEnc + 1000) return weeks;\n  while(guard++<700){\n    weeks.push({wk,yr});\n    if(yr*100+wk>=endEnc) break;\n    const last=lastIsoWeek(yr);\n    if(wk>=last){ wk=1; yr+=1; } else wk+=1;\n  }\n  return weeks;\n}\nfunction monthAbbrev(yr,wk){\n  const d = new Date(Date.UTC(yr,0,1)); d.setUTCDate(d.getUTCDate()+(wk-1)*7);\n  return d.toLocaleString('en-US',{month:'short', timeZone:'UTC'});\n}\nfunction decorateWeeks(weeks){\n  const today = getISOWeekYear(new Date());\n  return weeks.map((w,i)=>{\n    const month = monthAbbrev(w.yr,w.wk);\n    const isYearStart = i===0 || weeks[i-1].yr!==w.yr;\n    const isMonthStart = i===0 || monthAbbrev(weeks[i-1].yr,weeks[i-1].wk)!==month;\n    return {wk:w.wk, yr:w.yr, month, isYearStart, isMonthStart, isCurrent: w.wk===today.week && w.yr===today.year};\n  });\n}\nfunction buildSegments(weeks, colW, keyFn){\n  const segs=[]; let i=0;\n  while(i<weeks.length){\n    let j=i; const k=keyFn(weeks[i]);\n    while(j<weeks.length && keyFn(weeks[j])===k) j++;\n    segs.push({left:i*colW, width:(j-i)*colW, label:k});\n    i=j;\n  }\n  return segs;\n}\nfunction computeBar(act, weeks, colW){\n  if(!weeks.length || !act.startWk||!act.startYr||!act.endWk||!act.endYr) return {visible:false};\n  const startEnc = act.startYr*100+act.startWk, endEnc = act.endYr*100+act.endWk;\n  const firstEnc = weeks[0].yr*100+weeks[0].wk, lastEnc = weeks[weeks.length-1].yr*100+weeks[weeks.length-1].wk;\n  if(endEnc<firstEnc || startEnc>lastEnc) return {visible:false};\n  let startIdx = weeks.findIndex(w=> w.yr*100+w.wk>=startEnc);\n  if(startIdx<0) startIdx = 0;\n  let endIdx = weeks.length-1;\n  for(let i=weeks.length-1;i>=0;i--){ if(weeks[i].yr*100+weeks[i].wk<=endEnc){ endIdx=i; break; } }\n  if(endIdx<startIdx) endIdx = startIdx;\n  return {visible:true, left:startIdx*colW, width:(endIdx-startIdx+1)*colW};\n}\n// The global window: earliest start and latest end across EVERY loaded timeplan file,\n// so nothing is cropped out on first load. A single plan's own P3:S3 window is only a\n// fallback for a set with no dated rows at all.\nfunction computeDefaultRange(plans){\n  let minEnc=Infinity, maxEnc=-Infinity, minWk,minYr,maxWk,maxYr;\n  (plans||[]).forEach(p=>{\n    p.activities.forEach(a=>{\n      if(a.startYr && a.startWk){ const enc=a.startYr*100+a.startWk; if(enc<minEnc){minEnc=enc;minWk=a.startWk;minYr=a.startYr;} }\n      if(a.endYr && a.endWk){ const enc=a.endYr*100+a.endWk; if(enc>maxEnc){maxEnc=enc;maxWk=a.endWk;maxYr=a.endYr;} }\n      if(a.startYr && a.startWk && !(a.endYr && a.endWk)){ const enc=a.startYr*100+a.startWk; if(enc>maxEnc){maxEnc=enc;maxWk=a.startWk;maxYr=a.startYr;} }\n      if(a.endYr && a.endWk && !(a.startYr && a.startWk)){ const enc=a.endYr*100+a.endWk; if(enc<minEnc){minEnc=enc;minWk=a.endWk;minYr=a.endYr;} }\n    });\n  });\n  if(minEnc!==Infinity && maxEnc!==-Infinity){\n    return {startWk:minWk, startYr:minYr, endWk:maxWk, endYr:maxYr};\n  }\n  const withWindow = (plans||[]).find(p=>p.meta.startWk && p.meta.startYr && p.meta.endWk && p.meta.endYr);\n  if(withWindow) return {startWk:withWindow.meta.startWk, startYr:withWindow.meta.startYr, endWk:withWindow.meta.endWk, endYr:withWindow.meta.endYr};\n  const t=getISOWeekYear(new Date());\n  return {startWk:t.week,startYr:t.year,endWk:t.week,endYr:t.year+1};\n}\nfunction computeMasterRange(plans, crop){ return crop || computeDefaultRange(plans); }\n\nfunction parseDependencies(raw){\n  if(!raw) return [];\n  return String(raw).split(/[;,]+/).map(s=>s.trim().replace(/^[\"'\\u201c\\u2018]+|[\"'\\u201d\\u2019]+$/g,'').trim()).filter(Boolean);\n}\nfunction depNameKey(s){ return String(s==null?'':s).replace(/\\s+/g,' ').trim().toLowerCase(); }\n\n// ---- health checks ----------------------------------------------------------\n// One pass over the loaded set producing a flat, human-readable issue list: file\n// hygiene, identity, freshness, date validity and dependency integrity. Errors are\n// things that make the master plan wrong; warnings are things that will bite later.\nfunction buildHealth(plans, diag, getEff, opts){\n  const o = opts || {};\n  const staleDays = Number(o.staleDays) || 14;\n  const issues = [];\n  const add = (sev, plan, msg) => issues.push({sev, planId: plan?plan.id:null, planKey: plan?plan.key:'', msg});\n  (o.skipped||[]).forEach(s=> issues.push({sev:'warn', planId:null, planKey:'', msg:'\"'+s.name+'\" was not loaded \\u2014 '+s.reason+'.'}));\n  const idSeen = {};\n  (plans||[]).forEach(p=>{\n    if(p.unknownLevel) add('error', p, 'The file name \"'+p.fileName+'\" has no L1\\u2013L5 prefix, so this plan has no level and sorts last.');\n    const pid = String((p.meta&&p.meta.planId)||'').trim();\n    if(!pid) add('warn', p, 'No Plan ID cell \\u2014 the file name is being used as the key, so renaming \"'+p.fileName+'\" would break every dependency pointing at it.');\n    else {\n      const k = depNameKey(pid);\n      if(idSeen[k]) add('error', p, 'Plan ID \"'+pid+'\" is
