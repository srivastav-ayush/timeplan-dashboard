         <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:6px\">\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">Responsible<\u002Flabel>\n              <input type=\"text\" value=\"{{ editPopup.responsible }}\" sc-camel-on-change=\"{{ onEditResponsible }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px;box-sizing:border-box\">\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">Department<\u002Flabel>\n              <input type=\"text\" value=\"{{ editPopup.department }}\" sc-camel-on-change=\"{{ onEditDepartment }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px;box-sizing:border-box;font-family:inherit\">\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:10.5px;color:#767267;margin-bottom:4px\">Location<\u002Flabel>\n              <input type=\"text\" value=\"{{ editPopup.location }}\" sc-camel-on-change=\"{{ onEditLocation }}\" style=\"width:100%;padding:6px 8px;border:1px solid #D8D4CB;border-radius:5px;font-size:12.5px;box-sizing:border-box\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ editPopup.error }}\">\n            <div style=\"font-size:11px;color:#B3261E;margin-bottom:8px\">{{ editPopup.error }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:12px\">\n            <button sc-camel-on-click=\"{{ skipDetailsStep }}\" style=\"padding:7px 14px;border:1px solid #D8D4CB;border-radius:6px;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:#767267\">Skip<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ applyDetailsStep }}\" style=\"padding:7px 14px;border:none;border-radius:6px;background:#1F2430;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer\">OK<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showMilestonesPage }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;overflow:auto;background:#FFFFFF\">\n      <div style=\"max-width:1180px;padding:26px 30px 60px;display:flex;flex-direction:column;gap:18px\">\n\n        <div style=\"display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:280px;display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-0.3px;color:#1F2430\">Milestones<\u002Fspan>\n            <span style=\"font-size:12.5px;color:#767267;line-height:1.55;max-width:660px;text-wrap:pretty\">Markers that sit on the master plan week axis rather than inside any timeplan file. Each one draws its symbol between the month and week rows and runs a line of its own colour down through every visible timeplan.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex:none\">\n            <button sc-camel-on-click=\"{{ onAddMilestone }}\" style=\"padding:9px 16px;border:none;border-radius:8px;background:#1F2430;color:#FFFFFF;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit\">Add milestone<\u002Fbutton>\n            <sc-if value=\"{{ msHasRows }}\">\n              <button sc-camel-on-click=\"{{ onClearMilestones }}\" title=\"Delete every milestone\" style=\"padding:9px 14px;border:1px solid #D8D4CB;border-radius:8px;background:#FFFFFF;color:#767267;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit\">Remove all<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px 26px;padding:12px 14px;border:1px solid #EEECE6;border-radius:10px;background:#FCFBF8\">\n          <sc-for list=\"{{ msLegend }}\" as=\"lg\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <div style=\"{{ lg.shapeStyle }}\"><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:1px\">\n                <span style=\"font-size:11.5px;font-weight:700;color:#1F2430\">{{ lg.label }}<\u002Fspan>\n                <span style=\"font-size:10.5px;color:#8A857A;line-height:1.35\">{{ lg.hint }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ msHasOffAxis }}\">\n          <div style=\"padding:9px 13px;border-radius:8px;background:#FDF6E7;color:#8A5A00;font-size:11.5px;line-height:1.5\">{{ msOffAxisNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ msEmpty }}\">\n          <div style=\"padding:34px 30px;border:2px dashed #D8D4CB;border-radius:12px;text-align:center;display:flex;flex-direction:column;gap:7px;align-items:center\">\n            <span style=\"font-size:13.5px;font-weight:700;color:#1F2430\">No milestones yet<\u002Fspan>\n            <span style=\"font-size:12px;color:#767267;line-height:1.6;max-width:430px;text-wrap:pretty\">Click <strong>Add milestone<\u002Fstrong>. Each new row lets you pick a symbol and a colour, give it a name, and set the week and year it lands on.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ msRows }}\" as=\"ms\" hint-placeholder-count=\"0\">\n          <div style=\"{{ ms.rowStyle }}\">\n            <span style=\"flex:none;width:20px;font-size:12px;font-weight:700;color:#B4B0A6\">{{ ms.index }}<\u002Fspan>\n\n            <div style=\"flex:none;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Symbol<\u002Fspan>\n              <div style=\"display:flex;gap:6px\">\n                <sc-for list=\"{{ ms.shapes }}\" as=\"sh\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ sh.onClick }}\" title=\"{{ sh.title }}\" style=\"{{ sh.btnStyle }}\">\n                    <div style=\"{{ sh.shapeStyle }}\"><\u002Fdiv>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:none;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Colour<\u002Fspan>\n              <div style=\"display:flex;gap:7px;align-items:center;height:34px\">\n                <sc-for list=\"{{ ms.colors }}\" as=\"co\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ co.onClick }}\" title=\"{{ co.title }}\" style=\"{{ co.swatchStyle }}\"><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Name<\u002Fspan>\n              <input type=\"text\" value=\"{{ ms.label }}\" sc-camel-on-input=\"{{ ms.onLabel }}\" sc-camel-on-change=\"{{ ms.onLabel }}\" sc-camel-auto-complete=\"off\" sc-camel-spell-check=\"{{ false }}\" style=\"height:34px;padding:0 10px;border:1px solid #D8D4CB;border-radius:7px;font-size:12.5px;font-family:inherit;color:#1F2430;background:#FFFFFF;width:100%;box-sizing:border-box\">\n            <\u002Fdiv>\n\n            <div style=\"flex:none;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Week<\u002Fspan>\n              <input type=\"number\" min=\"1\" max=\"53\" value=\"{{ ms.wk }}\" sc-camel-on-input=\"{{ ms.onWk }}\" sc-camel-on-change=\"{{ ms.onWk }}\" style=\"width:66px;height:34px;padding:0 8px;border:1px solid #D8D4CB;border-radius:7px;font-size:12.5px;font-family:inherit;color:#1F2430;background:#FFFFFF;box-sizing:border-box\">\n            <\u002Fdiv>\n\n            <div style=\"flex:none;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Year<\u002Fspan>\n              <input type=\"number\" min=\"2000\" max=\"2100\" value=\"{{ ms.yr }}\" sc-camel-on-input=\"{{ ms.onYr }}\" sc-camel-on-change=\"{{ ms.onYr }}\" style=\"width:82px;height:34px;padding:0 8px;border:1px solid #D8D4CB;border-radius:7px;font-size:12.5px;font-family:inherit;color:#1F2430;background:#FFFFFF;box-sizing:border-box\">\n            <\u002Fdiv>\n\n            <div style=\"flex:none;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Show<\u002Fspan>\n              <label style=\"height:34px;display:flex;align-items:center;justify-content:center;width:34px;cursor:pointer\">\n                <input type=\"checkbox\" checked=\"{{ ms.on }}\" sc-camel-on-change=\"{{ ms.onToggle }}\" style=\"width:16px;height:16px;cursor:pointer\">\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"flex:none;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:transparent\">Del<\u002Fspan>\n              <button sc-camel-on-click=\"{{ ms.onRemove }}\" title=\"Delete this milestone\" style=\"width:34px;height:34px;border:1px solid #E4E1DA;border-radius:8px;background:#FFFFFF;color:#B3261E;font-size:15px;line-height:1;cursor:pointer;font-family:inherit\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showMarkersPage }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;overflow:auto;background:#FFFFFF\">\n      <div style=\"max-width:1180px;padding:26px 30px 60px;display:flex;flex-direction:column;gap:18px\">\n\n        <div style=\"display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:280px;display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-0.3px;color:#1F2430\">Markers<\u002Fspan>\n            <span style=\"font-size:12.5px;color:#767267;line-height:1.55;max-width:660px;text-wrap:pretty\">A symbol pinned to one cell of the master plan. Pick the timeplan, then the activity, then the week and year: that is the cell it lands in. The name you type sits beside the symbol. Nothing is written into the Excel files.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex:none\">\n            <button sc-camel-on-click=\"{{ onAddCellMarker }}\" style=\"padding:9px 16px;border:none;border-radius:8px;background:#1F2430;color:#FFFFFF;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit\">Add marker<\u002Fbutton>\n            <sc-if value=\"{{ mkHasRows }}\">\n              <button sc-camel-on-click=\"{{ onClearCellMarkers }}\" title=\"Delete every marker\" style=\"padding:9px 14px;border:1px solid #D8D4CB;border-radius:8px;background:#FFFFFF;color:#767267;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit\">Remove all<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ mkHasOffAxis }}\">\n          <div style=\"padding:9px 13px;border-radius:8px;background:#FDF6E7;color:#8A5A00;font-size:11.5px;line-height:1.5\">{{ mkOffAxisNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mkNoPlans }}\">\n          <div style=\"padding:9px 13px;border-radius:8px;background:#FDF6E7;color:#8A5A00;font-size:11.5px;line-height:1.5\">Load the timeplan folder first — a marker needs a timeplan and an activity to sit on.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mkEmpty }}\">\n          <div style=\"padding:34px 30px;border:2px dashed #D8D4CB;border-radius:12px;text-align:center;display:flex;flex-direction:column;gap:9px;align-items:center\">\n            <span style=\"font-size:13.5px;font-weight:700;color:#1F2430\">No markers yet<\u002Fspan>\n            <span style=\"font-size:12px;color:#767267;line-height:1.6;max-width:460px;text-wrap:pretty\">Click <strong>Add marker<\u002Fstrong>, choose a symbol and colour, then say which timeplan, which activity and which week it belongs to.<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:4px\">\n              <sc-for list=\"{{ mkLegend }}\" as=\"lg\" hint-placeholder-count=\"12\">\n                <span title=\"{{ lg.label }}\" style=\"font-size:15px;color:#4A473F;line-height:1\">{{ lg.glyph }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ mkRows }}\" as=\"mk\" hint-placeholder-count=\"0\">\n          <div style=\"{{ mk.rowStyle }}\">\n\n            <div style=\"flex:none;display:flex;flex-direction:column;gap:7px;align-items:center\">\n              <span style=\"font-size:12px;font-weight:700;color:#B4B0A6;line-height:1\">{{ mk.index }}<\u002Fspan>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap;width:190px\">\n                <sc-for list=\"{{ mk.symbols }}\" as=\"sy\" hint-placeholder-count=\"12\">\n                  <button sc-camel-on-click=\"{{ sy.onClick }}\" title=\"{{ sy.title }}\" style=\"{{ sy.btnStyle }}\">{{ sy.glyph }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:7px;align-items:center\">\n                <sc-for list=\"{{ mk.colors }}\" as=\"co\" hint-placeholder-count=\"6\">\n                  <button sc-camel-on-click=\"{{ co.onClick }}\" title=\"{{ co.title }}\" style=\"{{ co.swatchStyle }}\"><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:1;min-width:340px;display:flex;flex-direction:column;gap:11px\">\n\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end\">\n                <div style=\"flex:none;display:flex;flex-direction:column;gap:5px;width:160px\">\n                  <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Timeplan<\u002Fspan>\n                  <sc-raw-select value=\"{{ mk.planValue }}\" sc-camel-on-change=\"{{ mk.onPlan }}\" style=\"height:34px;padding:0 8px;border:1px solid #D8D4CB;border-radius:7px;font-size:12.5px;font-family:inherit;color:#1F2430;background:#FFFFFF;width:100%;box-sizing:border-box\">\n                    <sc-for list=\"{{ mk.planOptions }}\" as=\"po\" hint-placeholder-count=\"3\">\n                      <option value=\"{{ po.value }}\">{{ po.label }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div style=\"flex:2;min-width:220px;display:flex;flex-direction:column;gap:5px\">\n                  <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Activity<\u002Fspan>\n                  <sc-raw-select value=\"{{ mk.actValue }}\" sc-camel-on-change=\"{{ mk.onAct }}\" style=\"height:34px;padding:0 8px;border:1px solid #D8D4CB;border-radius:7px;font-size:12.5px;font-family:inherit;color:#1F2430;background:#FFFFFF;width:100%;box-sizing:border-box\">\n                    <sc-for list=\"{{ mk.actOptions }}\" as=\"ao\" hint-placeholder-count=\"5\">\n                      <option value=\"{{ ao.value }}\">{{ ao.label }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:180px;display:flex;gap:10px;align-items:flex-end\">\n                  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n                    <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Name<\u002Fspan>\n                    <input type=\"text\" value=\"{{ mk.label }}\" sc-camel-on-input=\"{{ mk.onLabel }}\" sc-camel-on-change=\"{{ mk.onLabel }}\" sc-camel-auto-complete=\"off\" sc-camel-spell-check=\"{{ false }}\" style=\"height:34px;padding:0 10px;border:1px solid #D8D4CB;border-radius:7px;font-size:12.5px;font-family:inherit;color:#1F2430;background:#FFFFFF;width:100%;box-sizing:border-box\">\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ mk.onRemove }}\" title=\"Delete this marker\" style=\"flex:none;width:34px;height:34px;border:1px solid #E4E1DA;border-radius:8px;background:#FFFFFF;color:#B3261E;font-size:15px;line-height:1;cursor:pointer;font-family:inherit\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end\">\n                <div style=\"flex:none;display:flex;flex-direction:column;gap:5px\">\n                  <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Week<\u002Fspan>\n                  <input type=\"number\" min=\"1\" max=\"53\" value=\"{{ mk.wk }}\" sc-camel-on-input=\"{{ mk.onWk }}\" sc-camel-on-change=\"{{ mk.onWk }}\" style=\"width:74px;height:34px;padding:0 8px;border:1px solid #D8D4CB;border-radius:7px;font-size:12.5px;font-family:inherit;color:#1F2430;background:#FFFFFF;box-sizing:border-box\">\n                <\u002Fdiv>\n                <div style=\"flex:none;display:flex;flex-direction:column;gap:5px\">\n                  <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">Year<\u002Fspan>\n                  <input type=\"number\" min=\"2000\" max=\"2100\" value=\"{{ mk.yr }}\" sc-camel-on-input=\"{{ mk.onYr }}\" sc-camel-on-change=\"{{ mk.onYr }}\" style=\"width:86px;height:34px;padding:0 8px;border:1px solid #D8D4CB;border-radius:7px;font-size:12.5px;font-family:inherit;color:#1F2430;background:#FFFFFF;box-sizing:border-box\">\n                <\u002Fdiv>\n                <label style=\"flex:none;height:34px;display:flex;align-items:center;gap:7px;cursor:pointer;padding-top:14px\">\n                  <input type=\"checkbox\" checked=\"{{ mk.on }}\" sc-camel-on-change=\"{{ mk.onToggle }}\" style=\"width:16px;height:16px;cursor:pointer\">\n                  <span style=\"font-size:11.5px;color:#4A473F\">Show on the master plan<\u002Fspan>\n                <\u002Flabel>\n                <span style=\"{{ mk.cellNoteStyle }}\">{{ mk.cellNote }}<\u002Fspan>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ notLoaded }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:40px\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drop=\"{{ onDropFile }}\">\n      <div style=\"max-width:520px;margin:auto;text-align:left;padding:34px 38px;border:2px dashed #D8D4CB;border-radius:12px;background:#FFFFFF\">\n        <sc-if value=\"{{ hasLogo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:center;padding-bottom:24px;margin-bottom:22px;border-bottom:1px solid #EDEBE4\">\n            <div role=\"img\" aria-label=\"Brand logo\" style=\"{{ logoEmptyStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:8px;color:#1F2430\">Load your timeplan files<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#767267;line-height:1.65\">Use <strong>Load folder<\u002Fstrong> to point at the folder your timeplan owners save into, or drag every <code>.xlsx<\u002Fcode> onto this box. Each file is one timeplan.<\u002Fdiv>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #EDEBE4;font-size:12px;color:#4A473F;line-height:1.7\">\n          <div style=\"font-weight:700;margin-bottom:4px\">Naming rule<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#1F2430\">L1_Project.xlsx &nbsp; L2_Component.xlsx &nbsp; L2_Assembly.xlsx &nbsp; L3_Tooling.xlsx<\u002Fdiv>\n          <div style=\"margin-top:6px;color:#767267\">The leading <strong>L1…L9<\u002Fstrong> sets the stacking order (L1 on top). Files at the same level are ordered alphabetically by the word after the level. Several files may share a level.<\u002Fdiv>\n          <div style=\"font-weight:700;margin:12px 0 4px\">Dependencies<\u002Fdiv>\n          <div style=\"color:#767267\">Write them as <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#1F2430\">L1_Project-14<\u002Fspan> — file name, a hyphen, then the No. of the activity it waits for. Several separated by <b>;<\u002Fb>. The activity name works instead of the No.; a bare No. or name means “in this same file”.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:11.5px;color:#9A968C\">Everything is parsed and rendered locally in your browser — nothing leaves your machine, and it works fully offline.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;comfortable&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;showCurrentWeekMarker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#000000&quot;,&quot;options&quot;:[&quot;#000000&quot;,&quot;#1F3864&quot;,&quot;#2E5C8A&quot;,&quot;#9A3412&quot;,&quot;#166534&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;pdfFooterNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Confidential — internal use only&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Export&quot;},&quot;saveNaming&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;inPlace&quot;,&quot;options&quot;:[&quot;inPlace&quot;,&quot;suffix&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Saving&quot;},&quot;strictFileNames&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Warnings&quot;},&quot;staleDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:1,&quot;max&quot;:180,&quot;unit&quot;:&quot;days&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Warnings&quot;}}\">\n// Level identity, drawn from the same five colours as everything else (see\n// ACTIVITY_COLOURS below — literal here because that constant is declared later):\n// L1 blue, L2 green, L3 yellow, L4 purple, L5 red. Used for the tab and for the\n// band down the left of the master plan, so the two always agree.\nconst LEVEL_COLORS = ['#4472C4','#70AD47','#FFC000','#9B59B6','#E74B3B'];\n\n// The Status column is the one thing a person types (a dropdown in Excel). Fourteen\n// values, in the workbook's dropdown order, coloured identically here and in the\n// .xlsx conditional formatting: green = closed and delivered, grey = closed and not\n// delivered, red = failed or blocked, amber/purple = waiting, blue/teal = planned.\nconst STATUS_STYLES = {\n  'Completed':       {bg:'#D5F5E3', fg:'#1E8449', bold:true,  italic:false},\n  'Cancelled':       {bg:'#E5E7E9', fg:'#7B7D7D', bold:true,  italic:false},\n  'Skipped':         {bg:'#F2F3F4', fg:'#7B7D7D', bold:false, italic:true},\n  'Risk':            {bg:'#FAE5D3', fg:'#B9770E', bold:true,  italic:false},\n  'Blocker':         {bg:'#E74C3C', fg:'#FFFFFF', bold:true,  italic:false},\n  'Dependency':      {bg:'#FCF3CF', fg:'#9A7D0A', bold:false, italic:true},\n  'Aligned':         {bg:'#D1F2EB', fg:'#117864', bold:false, italic:false},\n  'Planned':         {bg:'#D6EAF8', fg:'#1A5276', bold:false, italic:false},\n  'To be discussed': {bg:'#EAECEE', fg:'#5D6D7E', bold:false, italic:true},\n  'Not done':        {bg:'#FDEDEC', fg:'#A93226', bold:false, italic:false},\n  'Deferred':        {bg:'#EBDEF0', fg:'#6C3483', bold:false, italic:true},\n  'Not Achieved':    {bg:'#F5B7B1', fg:'#922B21', bold:true,  italic:false},\n  'Pending':         {bg:'#FEF5E7', fg:'#9A7D0A', bold:false, italic:false},\n  'Not Completed':   {bg:'#FADBD8', fg:'#922B21', bold:false, italic:false},\n};\nconst DEFAULT_STATUS_STYLE = {bg:'#F4F3EF', fg:'#767267', bold:false, italic:false};\n\n// ---- Tracker ----------------------------------------------------------------\n// The Tracker is not typed by anyone. It answers one question — is this on time? — from\n// the Status column and the activity's END week against the current ISO week:\n//\n//   Done           Status is Completed. Nothing else matters, early or late.\n//   Closed         Status is Cancelled or Skipped: off the plan, so never late.\n//   Incomplete     the end week has passed and the activity is not closed out.\n//   Due this week  the current week IS the end week and it is not closed out.\n//   On Track       the end week is still ahead.\n//   (blank)        no activity name, or no end week/year to judge against.\n//\n// Every other Status (Risk, Blocker, Pending, Not done, Deferred, …) says WHY, and is\n// judged on the calendar like anything else: still ahead of its end week it reads On\n// Track, past it, Incomplete.\n//\n// The identical rule is written into every .xlsx as a self-contained formula. It is\n// recomputed here rather than read out of the Tracker cell, because a formula's cached\n// value in the file is empty until Excel recalculates it.\nconst TRACKER_STYLES = {\n  'Incomplete':    {bg:'#C0392B', fg:'#FFFFFF', bold:true,  italic:false},\n  'Due this week': {bg:'#FAE5D3', fg:'#B9770E', bold:true,  italic:false},\n  'Done':          {bg:'#D5F5E3', fg:'#1E8449', bold:true,  italic:false},\n  'Closed':        {bg:'#E5E7E9', fg:'#7B7D7D', bold:true,  italic:false},\n  'On Track':      {bg:'#D1F2EB', fg:'#117864', bold:false, italic:false},\n};\nconst DEFAULT_TRACKER_STYLE = {bg:'#F4F3EF', fg:'#C9C6BD', bold:false, italic:false};\nfunction trackerFor(act){\n  const blank = {key:'', label:'\\u2014', title:'No end week set \\u2014 nothing to track against.'};\n  if(!act || !String(act.activity||'').trim()) return blank;\n  const st = String(act.status||'').trim();\n  if(/^completed$/i.test(st))\n    return {key:'Done', label:'Done', title:'Marked Completed in the Status column.'};\n  if(/^(cancelled|canceled|skipped)$/i.test(st))\n    return {key:'Closed', label:'Closed', title:'Status says '+st+' \\u2014 off the plan, so it is not tracked against a date.'};\n  const endAbs = absWeek(act.endWk, act.endYr);\n  if(endAbs == null) return blank;\n  const t = getISOWeekYear(new Date());\n  const nowAbs = absWeek(t.week, t.year);\n  if(nowAbs == null) return blank;\n  const endLbl = weekLabel(act.endWk, act.endYr);\n  if(nowAbs > endAbs){\n    const n = nowAbs - endAbs;\n    return {key:'Incomplete', label:'Incomplete',\n      title:'Due '+endLbl+', which was '+n+' week'+(n===1?'':'s')+' ago, and the Status column does not close it out'+(st?(' (it says '+st+')'):'')+'.'};\n  }\n  if(nowAbs === endAbs)\n    return {key:'Due this week', label:'Due this week', title:'Due this week ('+endLbl+') and not yet closed out.'};\n  return {key:'On Track', label:'On Track', title:'Due '+endLbl+', which is '+(endAbs-nowAbs)+' week'+((endAbs-nowAbs)===1?'':'s')+' away.'};\n}\nfunction trackerLook(key){ return TRACKER_STYLES[key] || DEFAULT_TRACKER_STYLE; }\n\n// ---- activity colour palette (owned by Excel) -------------------------------\n// The colour column (immediately left of No.) is an Excel dropdown holding one of\n// these names. The name is the single source of truth: Excel fills the cell and the\n// Gantt bars from it, and the dashboard reads the same name here. There is\n// deliberately no colour picker in the HTML — change the colour in the workbook.\nconst ACTIVITY_COLOURS = {\n  red:    '#E74B3B',\n  yellow: '#FFC000',\n  green:  '#70AD47',\n  blue:   '#4472C4',\n  purple: '#9B59B6',\n};\n// The same five colours are the ONLY palette anywhere in the dashboard: activity\n// fills, level/tab identity, milestone symbols and cell markers all draw from it.\nconst PALETTE_5 = Object.keys(ACTIVITY_COLOURS).map(k=>ACTIVITY_COLOURS[k]);\n// An older record may hold a colour that is no longer offered; snap it to the\n// nearest of the five rather than rendering a swatch the user cannot re-pick.\nfunction snapToPalette(hex){\n  const h = String(hex||'').replace('#','');\n  if(h.length!==6) return PALETTE_5[0];\n  const n = parseInt(h,16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;\n  let best = PALETTE_5[0], bd = Infinity;\n  PALETTE_5.forEach(p=>{\n    const m = parseInt(p.slice(1),16);\n    const d = (r-((m>>16)&255))**2 + (g-((m>>8)&255))**2 + (b-(m&255))**2;\n    if(d<bd){ bd=d; best=p; }\n  });\n  return best;\n}\n// Shown for an activity whose colour cell is still empty — matches the grey the\n// Excel time plan sheet paints for an unpicked colour.\nconst COLOUR_UNSET = '#98A2B3';\nfunction colourFromName(v){\n  const k = String(v==null?'':v).replace(/\\s+/g,' ').trim().toLowerCase();\n  return ACTIVITY_COLOURS[k] || null;\n}\n\nconst PALETTE_FALLBACK = ['4472C4','ED7D31','70AD47','FFC000','FF6B6B','9B59B6','00BCD4','E74B3B','2ECC71','F39C12',\n  '5B9BD5','A9D18E','E91E63','1ABC9C','3498DB','7030A0','00B0F0','FF0000','92D050','4BACC6',\n  'C55A11','4A8136','843C0C','2E75B6','833C00','BF8E00','375623','1F3864','C00000','2C5494',\n  'F4B183','A9D18E','FF99CC','D6DEE9','B4C6E7','FFD966','C9C9C9','70AD47','ED7D31','4472C4',\n  '7030A0','FF6B6B','00BCD4','2ECC71','F39C12','E74B3B','9B59B6','3498DB','5B9BD5','4472C4'].map(h=>'#'+h);\n\nfunction mixHex(hex, other, t){\n  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];\n  const a = p(hex), b = p(other);\n  const c = a.map((v,i)=> Math.round(v + (b[i]-v)*t));\n  return '#' + c.map(v=>v.toString(16).padStart(2,'0')).join('');\n}\n// Several files can sit at the same level (two L2s), so the 2nd, 3rd… plan of a level\n// gets a progressively lighter tint of that level's colour to stay tellable apart.\n// Black or white text, whichever stays legible on the given fill.\nfunction readableOn(hex){\n  const h = String(hex||'').replace('#','');\n  const n = h.length===3 ? h.split('').map(c=>c+c).join('') : h;\n  const r = parseInt(n.slice(0,2),16)/255, g = parseInt(n.slice(2,4),16)/255, b = parseInt(n.slice(4,6),16)/255;\n  const lin = v => v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);\n  const L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);\n  return L > 0.20 ? '#1F2430' : '#FFFFFF';\n}\nfunction levelColor(level, dupIndex){\n  const lv = Math.max(1, Number(level) || 1);\n  const base = LEVEL_COLORS[(lv-1) % LEVEL_COLORS.length];\n  // The palette is five colours, so L6 lands back on L1's blue. Each further cycle is\n  // lightened as well, the same way a second plan at one level is, so an L6 can never be\n  // mistaken for an L1 on the tab or in the gutter.\n  const cycle = Math.floor((lv-1) / LEVEL_COLORS.length);\n  const t = Math.min(0.5, cycle*0.26 + (Number(dupIndex)||0)*0.17);\n  return t ? mixHex(base, '#FFFFFF', t) : base;\n}\n\nfunction decodeXmlEntities(s){\n  return s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))\n          .replace(/&#(\\d+);/g,(_,d)=>String.fromCodePoint(parseInt(d,10)))\n          .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'\"').replace(/&apos;/g,\"'\").replace(/&amp;/g,'&');\n}\n\nasync function inflateRaw(bytes){\n  if(typeof DecompressionStream==='undefined') throw new Error('Your browser does not support offline unzip (DecompressionStream). Use a recent Chrome, Edge, or Firefox.');\n  const ds = new DecompressionStream('deflate-raw');\n  const stream = new Blob([bytes]).stream().pipeThrough(ds);\n  const buf = await new Response(stream).arrayBuffer();\n  return new Uint8Array(buf);\n}\nfunction readU16(dv,o){ return dv.getUint16(o,true); }\nfunction readU32(dv,o){ return dv.getUint32(o,true); }\nasync function unzip(ab){\n  const bytes = new Uint8Array(ab);\n  const dv = new DataView(ab);\n  let eocd=-1;\n  for(let i=bytes.length-22;i>=0 && i> bytes.length-22-65557;i--){\n    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }\n  }\n  if(eocd<0) throw new Error('Not a valid .xlsx file (zip end marker not found).');\n  const cdOffset = readU32(dv,eocd+16);\n  const cdCount = readU16(dv,eocd+10);\n  let p = cdOffset;\n  const entries = {};\n  for(let i=0;i<cdCount;i++){\n    const method = readU16(dv,p+10);\n    const compSize = readU32(dv,p+20);\n    const fnLen = readU16(dv,p+28);\n    const extraLen = readU16(dv,p+30);\n    const commentLen = readU16(dv,p+32);\n    const localOffset = readU32(dv,p+42);\n    const name = new TextDecoder().decode(bytes.slice(p+46,p+46+fnLen));\n    entries[name] = {method,compSize,localOffset};\n    p += 46+fnLen+extraLen+commentLen;\n  }\n  return {bytes,dv,entries};\n}\nasync function extractFile(zip, name){\n  const e = zip.entries[name];\n  if(!e) return null;\n  const dv = zip.dv;\n  const lp = e.localOffset;\n  const fnLen = readU16(dv, lp+26);\n  const extraLen = readU16(dv, lp+28);\n  const dataStart = lp+30+fnLen+extraLen;\n  const compData = zip.bytes.slice(dataStart, dataStart+e.compSize);\n  const out = e.method===0 ? compData : await inflateRaw(compData);\n  return new TextDecoder('utf-8').decode(out);\n}\n\nfunction extractRunsText(inner){\n  let out = '';\n  const re = /<t[^>]*>([\\s\\S]*?)<\\/t>/g;\n  let m;\n  while((m = re.exec(inner))){ out += m[1]; }\n  return decodeXmlEntities(out);\n}\nfunction parseSharedStrings(xml){\n  if(!xml) return [];\n  const items = [];\n  const re = /<si\\b[^>]*>([\\s\\S]*?)<\\/si>/g;\n  let m;\n  while((m = re.exec(xml))){ items.push(extractRunsText(m[1])); }\n  return items;\n}\nfunction parseCells(xml, sharedStrings){\n  sharedStrings = sharedStrings || [];\n  const cells = {};\n  const re = /<c r=\"([A-Za-z]+)(\\d+)\"([^>]*?)(?:\\/>|>([\\s\\S]*?)<\\/c>)/g;\n  let m;\n  while((m = re.exec(xml))){\n    const ref = m[1]+m[2];\n    const attrs = m[3]||'';\n    const inner = m[4]||'';\n    const tMatch = attrs.match(/\\bt=\"([^\"]+)\"/);\n    const sMatch = attrs.match(/\\bs=\"(\\d+)\"/);\n    const type = tMatch ? tMatch[1] : 'n';\n    let value = null;\n    if(type==='inlineStr'){\n      const ism = inner.match(/<is>([\\s\\S]*?)<\\/is>/);\n      value = extractRunsText(ism ? ism[1] : inner);\n    } else if(type==='s'){\n      const vm = inner.match(/<v>([\\s\\S]*?)<\\/v>/);\n      const idx = vm ? Number(decodeXmlEntities(vm[1])) : NaN;\n      value = Number.isFinite(idx) ? (sharedStrings[idx] ?? '') : '';\n    } else {\n      const vm = inner.match(/<v>([\\s\\S]*?)<\\/v>/);\n      if(vm){\n        const raw = decodeXmlEntities(vm[1]);\n        value = (type=== hipped .xlsx files are actually set up for: the Tracker\n// formula, the Colour and Status dropdowns, the status colouring and the Gantt bar rules\n// all cover input rows 8-207 (time plan rows 7-206) — 200 activities. The dashboard\n// itself reads far more (see the row scan), so this is only the number the warning quotes.\nconst TEMPLATE_ROWS = 200;\n// Status sits BEFORE Tracker: the person types the status, the tracker is derived from it.\n// Only a fallback — detectLayout reads the real letters off the header row.\nconst DEFAULT_LAYOUT = {\n  headerRow: 7, firstDataRow: 8,\n  cols: {no:'D', activity:'E', responsible:'F', department:'G', location:'H', startWk:'I', startYr:'J',\n    endWk:'K', endYr:'L', status:'M', tracker:'N', comments:'O', dependencies:'P'},\n};\nfunction normHeader(v){ return String(v==null?'':v).replace(/\\s+/g,' ').trim().toLowerCase(); }\nfunction colNumToLetter(n){\n  let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-m-1)/26); }\n  return s;\n}\nfunction weekLabel(wk, yr){\n  if(!wk || !yr) return '\\u2014';\n  return 'W'+wk+\" '\"+String(yr).slice(-2);\n}\nfunction detectLayout(cells){\n  let headerRow = null;\n  for(const ref in cells){\n    if(HEADER_ALIASES[normHeader(cells[ref].value)] === 'activity'){\n      const m = /^([A-Z]+)(\\d+)$/.exec(ref);\n      if(m && (headerRow===null || Number(m[2])<headerRow)) headerRow = Number(m[2]);\n    }\n  }\n  if(headerRow===null) return DEFAULT_LAYOUT;\n  const cols = {};\n  for(const ref in cells){\n    const m = /^([A-Z]+)(\\d+)$/.exec(ref);\n    if(!m || Number(m[2])!==headerRow) continue;\n    const key = HEADER_ALIASES[normHeader(cells[ref].value)];\n    if(key && !cols[key]) cols[key] = m[1];\n  }\n  if(!cols.activity) return DEFAULT_LAYOUT;\n  for(const k in DEFAULT_LAYOUT.cols){ if(!cols[k]) cols[k] = DEFAULT_LAYOUT.cols[k]; }\n  return {headerRow, firstDataRow: headerRow+1, cols};\n}\n\nconst PLAN_NAME_LABEL_RE = /^(timeplan|time plan|plan)\\s*name$ hat\n// row only, with its name above it. Stored in localStorage beside the milestones.\nconst MK_KEY = 'tpDashboardCellMarkersV1';\nconst MK_SYMBOLS = [\n  {key:'star',       glyph:'\\u2605',       label:'Star'},\n  {key:'star6',      glyph:'\\u2736',       label:'Hexagonal star'},\n  {key:'star8',      glyph:'\\u2738',       label:'Eight-point star'},\n  {key:'smiley',     glyph:'\\u263A\\uFE0E', label:'Smiley'},\n  {key:'flag',       glyph:'\\u2691\\uFE0E', label:'Flag'},\n  {key:'tick',       glyph:'\\u2714',       label:'Tick'},\n  {key:'cross',      glyph:'\\u2716',       label:'Cross'},\n  {key:'bolt',       glyph:'\\u2607',       label:'Lightning'},\n  {key:'heart',      glyph:'\\u2665',       label:'Heart'},\n  {key:'triangleUp', glyph:'\\u25B2',       label:'Triangle'},\n  {key:'circle',     glyph:'\\u25CF',       label:'Circle'},\n  {key:'diamond',    glyph:'\\u25C6',       label:'Diamond'},\n];\nconst MK_COLORS = PALETTE_5.slice();\nfunction mkGlyph(key){\n  const s = MK_SYMBOLS.find(x=>x.key===key);\n  return s ? s.glyph : MK_SYMBOLS[0].glyph;\n}\nfunction loadCellMarkers(){\n  try {\n    const arr = JSON.parse(localStorage.getItem(MK_KEY)||'[]');\n    return Array.isArray(arr) ? arr.map(m=>({...m, color: snapToPalette(m.color)})) : [];\n  } catch(e){ return []; }\n}\nfunction saveCellMarkers(list){\n  try { localStorage.setItem(MK_KEY, JSON.stringify(list)); } catch(e){}\n}\n\nfunction loadMilestones(){\n  try {\n    const raw = localStorage.getItem(MS_KEY);\n    const arr = raw ? JSON.parse(raw) : [];\n    return Array.isArray(arr) ? arr.map(m=>({...m, color: snapToPalette(m.color)})) : [];\n  } catch(e){ return []; }\n}\nfunction saveMilestones(list){\n  try { localStorage.setItem(MS_KEY, JSON.stringify(list)); } catch(e){}\n}\n// One shape, drawn as a pure CSS box so the same record can style a div and an SVG node.\nfunction msBoxStyle(shape, color, size){\n  const s = {width:size+'px', height:size+'px', background:color, flex:'none'};\n  if(shape== lan status sheet '+(i+1)+' of '+plans.length+'<\u002Fh3>';\n      b += '<h2 style=\"margin-top:2px\">'+esc(p.key)+(this.getEffectivePlanName(p.id)?(' \\u2014 '+esc(this.getEffectivePlanName(p.id))):'')+'<\u002Fh2>';\n      b += '<div class=\"chips\">'\n         + '<span class=\"chip\">Level <b>'+esc(p.levelKey)+'<\u002Fb><\u002Fspan>'\n         + '<span class=\"chip\">Activities <b>'+p.activities.length+'<\u002Fb><\u002Fspan>'\n         + '<span class=\"chip\">Last updated <b>'+(p.updatedAt?esc(fmtDay(p.updatedAt)):'not set')+'<\u002Fb>'+(age!==null?(' ('+age+'d)'):'')+'<\u002Fspan>'\n         + (base?('<span class=\"chip\">vs '+esc(base.label||monthLabel(base.id))+' <b>'+slipped+'<\u002Fb> later, <b>'+pulled+'<\u002Fb> earlier<\u002Fspan>'):'')\n         + '<span class=\"chip\">File checks <b>'+mine.length+'<\u002Fb><\u002Fspan>'\n         + '<\u002Fdiv>';\n      b += '<div class=\"note\">File <b>'+esc(p.fileName)+'<\u002Fb> &nbsp;|&nbsp; sheet <b>'+esc(p.sheetName)+'<\u002Fb> &nbsp;|&nbsp; Timeplan ID <b>'+esc(p.meta.planId||'not set')+'<\u002Fb> &nbsp;|&nbsp; Owner <b>'+esc(p.meta.owner||'not set')+'<\u002Fb> &nbsp;|&nbsp; dependency prefix <b class=\"mono\">'+esc(p.key)+'-<\u002Fb><\u002Fdiv>';\n      const statusBits = Object.keys(counts).map(k=>esc(k)+' '+counts[k]).join(' &nbsp;·&nbsp; ');\n      if(statusBits) b += '<div class=\"note\"><b>Status mix:<\u002Fb> '+statusBits+'<\u002Fdiv>';\n      b += '<table><thead><tr><th style=\"width:26px\">No<\u002Fth><th style=\"width:88px\">Ref<\u002Fth><th>Activity<\u002Fth><th style=\"width:80px\">Responsible<\u002Fth><th style=\"width:96px\">Department<\u002Fth><th style=\"width:70px\">Location<\u002Fth><th style=\"width:52px\">Start<\u002Fth><th style=\"width:52px\">End<\u002Fth><th style=\"width:62px\">Status<\u002Fth><th style=\"width:74px\">Tracker<\u002Fth>'\n         + (base?'<th style=\"width:52px\">vs base<\u002Fth>':'') + '<th>Depends on<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n      rows.forEach(({a,d,sl})
