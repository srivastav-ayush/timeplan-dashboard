document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script src=\"716a7e53-7108-4661-a572-824a3330aa45\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  *{box-sizing:border-box}\n  body{margin:0;background:#F7F6F2;color:#1F2430;-webkit-font-smoothing:antialiased}\n  a{color:#2E5C8A}\n  a:hover{color:#1F3864}\n  input[type=number]{font-family:inherit}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex;flex-direction:column;height:100vh;width:100%;font-family:Helvetica,Arial,sans-serif;background:#F7F6F2;overflow:hidden\">\n\n  <div style=\"flex:none;position:relative;z-index:200;background:#FFFFFF;border-bottom:1px solid #E4E1DA\">\n\n    <div style=\"display:flex;align-items:center;gap:20px;padding:11px 20px\">\n      <div style=\"display:flex;align-items:center;gap:14px;min-width:0\">\n        <span style=\"font-size:16px;font-weight:700;letter-spacing:-0.2px;white-space:nowrap\">Master Time Plan Dashboard<\u002Fspan>\n        <sc-if value=\"{{ fileLoaded }}\">\n          <div style=\"display:flex;align-items:center;gap:8px;flex:none\">\n            <div title=\"{{ statPlansTitle }}\" style=\"display:flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;border:1px solid #E4E1DA;border-radius:20px;background:#FCFBF8\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\">\n                <rect x=\"1\" y=\"1.5\" width=\"11\" height=\"2.4\" rx=\"1.2\" fill=\"#1F3864\"><\u002Frect>\n                <rect x=\"3\" y=\"5.8\" width=\"10\" height=\"2.4\" rx=\"1.2\" fill=\"#9A3412\"><\u002Frect>\n                <rect x=\"1.6\" y=\"10.1\" width=\"8\" height=\"2.4\" rx=\"1.2\" fill=\"#166534\"><\u002Frect>\n              <\u002Fsvg>\n              <span style=\"font-size:13px;font-weight:700;color:#1F2430;line-height:1\">{{ statPlans }}<\u002Fspan>\n              <span style=\"font-size:10.5px;color:#9A968C;line-height:1\">timeplans<\u002Fspan>\n            <\u002Fdiv>\n            <div title=\"{{ statActsTitle }}\" style=\"display:flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;border:1px solid #E4E1DA;border-radius:20px;background:#FCFBF8\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\">\n                <circle cx=\"2.6\" cy=\"2.6\" r=\"1.7\" fill=\"#1F2430\"><\u002Fcircle>\n                <circle cx=\"7\" cy=\"2.6\" r=\"1.7\" fill=\"#8A857A\"><\u002Fcircle>\n                <circle cx=\"11.4\" cy=\"2.6\" r=\"1.7\" fill=\"#C9C6BD\"><\u002Fcircle>\n                <circle cx=\"2.6\" cy=\"7\" r=\"1.7\" fill=\"#8A857A\"><\u002Fcircle>\n                <circle cx=\"7\" cy=\"7\" r=\"1.7\" fill=\"#C9C6BD\"><\u002Fcircle>\n                <circle cx=\"11.4\" cy=\"7\" r=\"1.7\" fill=\"#1F2430\"><\u002Fcircle>\n                <circle cx=\"2.6\" cy=\"11.4\" r=\"1.7\" fill=\"#C9C6BD\"><\u002Fcircle>\n                <circle cx=\"7\" cy=\"11.4\" r=\"1.7\" fill=\"#1F2430\"><\u002Fcircle>\n                <circle cx=\"11.4\" cy=\"11.4\" r=\"1.7\" fill=\"#8A857A\"><\u002Fcircle>\n              <\u002Fsvg>\n              <span style=\"font-size:13px;font-weight:700;color:#1F2430;line-height:1\">{{ statActs }}<\u002Fspan>\n              <span style=\"font-size:10.5px;color:#9A968C;line-height:1\">activities<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notLoaded }}\">\n          <span style=\"font-size:11.5px;color:#9A968C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ headerContext }}<\u002Fspan>\n        <\u002Fsc-if>\n        <span title=\"Dashboard version — everyone should be on the same one\" style=\"display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#4A473F;border:1px solid #E4E1DA;border-radius:20px;padding:3px 10px;white-space:nowrap;background:#FCFBF8\">\n          <span style=\"width:6px;height:6px;border-radius:50%;background:#1E8449;display:inline-block\"><\u002Fspan>{{ appVersion }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1\"><\u002Fdiv>\n\n      <sc-if value=\"{{ notLoaded }}\">\n        <div style=\"display:flex;align-items:center;gap:8px;flex:none\">\n          <button sc-camel-on-click=\"{{ triggerFolderPicker }}\" title=\"Point at the shared folder that holds L1_…, L2_… .xlsx timeplans — every .xlsx inside is loaded\" style=\"padding:7px 13px;border:1px solid #1E8449;border-radius:7px;background:#F3FAF5;font-size:12.5px;font-weight:600;cursor:pointer;color:#1E8449;font-family:inherit\">Load folder<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ triggerFilePicker }}\" title=\"Pick individual .xlsx timeplan files (hold Shift or Ctrl to select several)\" style=\"padding:7px 13px;border:1px solid #D8D4CB;border-radius:7px;background:#FFFFFF;font-size:12.5px;font-weight:600;cursor:pointer;color:#4A473F;font-family:inherit\">Load files…<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ fileLoaded }}\">\n        <div style=\"display:flex;align-items:center;gap:8px;flex:none\">\n          <button sc-camel-on-click=\"{{ onOpenFilesPanel }}\" title=\"Source folder, output folder, reload and clear\" style=\"{{ filesBtnStyle }}\">Files<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onOpenSavePanel }}\" disabled=\"{{ saving }}\" title=\"Review which timeplans changed and what changed in them, then write them back to Excel\" style=\"{{ saveBtnStyle }}\">{{ saveBtnLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onOpenExportPanel }}\" title=\"SVG, PNG and PDF exports of the current view\" style=\"{{ exportBtnStyle }}\">Export<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <input ref=\"{{ filesInputRef }}\" type=\"file\" accept=\".xlsx\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ onFilesChange }}\" style=\"position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px\">\n    <input ref=\"{{ dirInputRef }}\" type=\"file\" accept=\".xlsx\" multiple=\"{{ true }}\" webkitdirectory=\"true\" sc-camel-on-change=\"{{ onFilesChange }}\" style=\"position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px\">\n\n    <sc-if value=\"{{ fileLoaded }}\">\n      <div style=\"display:flex;align-items:center;gap:16px;padding:0 20px;border-top:1px solid #F1EFE9\">\n        <div style=\"flex:1;min-width:0;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden\">\n          <sc-for list=\"{{ navTabs }}\" as=\"nt\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ nt.onClick }}\" title=\"{{ nt.title }}\" style=\"{{ nt.style }}\">{{ nt.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;flex:none;padding:6px 0\">\n          <button sc-camel-on-click=\"{{ onOpenHealthPanel }}\" title=\"Timeplans nobody has updated recently, plus file-name, ID, date and dependency problems\" style=\"{{ healthBtnStyle }}\">{{ healthBtnLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onOpenBaselinePanel }}\" title=\"Freeze today's dates, then see what has moved since\" style=\"{{ baselineBtnStyle }}\">{{ baselineBtnLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onOpenImpactPanel }}\" title=\"Which other activities need moving or reviewing because something has moved\" style=\"{{ impactBtnStyle }}\">{{ impactBtnLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onOpenPlansPanel }}\" title=\"Show, hide, filter and rename individual timeplans\" style=\"{{ plansBtnStyle }}\">{{ plansBtnLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onOpenViewPanel }}\" title=\"Columns, timeline scale and the snapshot window\" style=\"{{ viewBtnStyle }}\">View<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelOpen }}\">\n      <div sc-camel-on-click=\"{{ onClosePanel }}\" style=\"position:fixed;top:0;right:0;bottom:0;left:0;z-index:290\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelFiles }}\">\n      <div style=\"position:absolute;top:100%;right:20px;margin-top:-1px;z-index:300;width:340px;background:#FFFFFF;border:1px solid #D8D4CB;border-radius:10px;box-shadow:0 14px 34px rgba(31,36,48,0.16);padding:14px;display:flex;flex-direction:column;gap:13px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C\">Source<\u002Fspan>\n          <span style=\"font-size:12px;color:#4A473F;word-break:break-word\">{{ sourceLabel }}<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:2px\">\n            <sc-if value=\"{{ canReload }}\">\n              <button sc-camel-on-click=\"{{ doReloadFolder }}\" title=\"Re-read every file in the folder — use this after an owner has updated their timeplan\" style=\"padding:6px 11px;border:1px solid #1E8449;border-radius:7px;background:#F3FAF5;font-size:12px;font-weight:600;cursor:pointer;color:#1E8449;font-family:inherit\">Reload folder<\u002Fbutton>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ doPickFolder }}\" title=\"Point at a different folder of timeplans\" style=\"padding:6px 11px;border:1px solid #D8D4CB;border-radius:7px;background:#FFFFFF;font-size:12px;font-weight:600;cursor:pointer;color:#4A473F;font-family:inherit\">Change folder<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ doPickFiles }}\" title=\"Pick individual .xlsx timeplan files\" style=\"padding:6px 11px;border:1px solid #D8D4CB;border-radius:7px;background:#FFFFFF;font-size:12px;font-weight:600;cursor:pointer;color:#4A473F;font-family:inherit\">Load files…<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:#EEECE6\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C\">Output<\u002Fspan>\n          <sc-if value=\"{{ saveInPlace }}\">\n            <span style=\"font-size:11.5px;color:#4A473F;line-height:1.45\">Save writes back into the original file in the source folder.<\u002Fspan>\n            <label style=\"display:flex;align-items:flex-start;gap:7px;cursor:pointer\">\n              <input type=\"checkbox\" checked=\"{{ archiveOn }}\" sc-camel-on-change=\"{{ onToggleArchive }}\" style=\"width:14px;height:14px;flex:none;margin-top:1px;cursor:pointer\">\n              <span style=\"font-size:11.5px;color:#4A473F;line-height:1.45\">{{ archiveLine }}<\u002Fspan>\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ doChooseArchiveFolder }}\" title=\"By default the copies go into 04_Archived_Timeplans inside the timeplan folder — pick another folder here if you want them somewhere else\" style=\"{{ archiveBtnStyle }}\">{{ archiveBtnLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notSaveInPlace }}\">\n            <button sc-camel-on-click=\"{{ doChooseOutputFolder }}\" title=\"Folder that Save to Excel writes the updated timeplan files into\" style=\"{{ outDirBtnStyle }}\">{{ outDirLabel }}<\u002Fbutton>\n            <span style=\"font-size:11px;color:#9A968C;line-height:1.45\">Saved files keep the original name plus an _edited_&lt;date&gt; suffix.<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:#EEECE6\"><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ doClearFile }}\" title=\"Unload every timeplan and start fresh — click twice\" style=\"{{ clearStyle }}\">{{ clearLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelSave }}\">\n      <div style=\"position:absolute;top:100%;right:20px;margin-top:-1px;z-index:300;width:470px;max-height:66vh;background:#FFFFFF;border:1px solid #D8D4CB;border-radius:10px;box-shadow:0 14px 34px rgba(31,36,48,0.16);display:flex;flex-direction:column;overflow:hidden\">\n        <div style=\"flex:none;padding:12px 14px 10px;border-bottom:1px solid #EEECE6\">\n          <div style=\"font-size:12.5px;font-weight:700;color:#1F2430\">Save to Excel<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#767267;line-height:1.5;margin-top:3px\">{{ saveIntro }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasSaveRows }}\">\n          <div style=\"flex:1;overflow:auto;padding:0 12px 10px\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:7px 2px 5px;border-bottom:1px solid #F1EFE9;position:sticky;top:0;background:#FFFFFF;z-index:2\">\n              <span style=\"width:10px;flex:none\"><\u002Fspan>\n              <span style=\"flex:1;min-width:0;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Timeplan<\u002Fspan>\n              <span style=\"width:120px;flex:none;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">What changed<\u002Fspan>\n              <span style=\"width:40px;flex:none;text-align:right;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">No.<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ saveRows }}\" as=\"sv\" hint-placeholder-count=\"2\">\n              <div style=\"padding:7px 0 8px;border-bottom:1px solid #F6F5F1\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:0 2px\">\n                  <span style=\"{{ sv.swatchStyle }}\"><\u002Fspan>\n                  <span style=\"flex:1;min-width:0;font-size:12px;font-weight:700;color:#1F2430;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ sv.planKey }}<\u002Fspan>\n                  <span style=\"width:120px;flex:none;font-size:11px;color:#4A473F\">{{ sv.breakdown }}<\u002Fspan>\n                  <span style=\"width:40px;flex:none;text-align:right;font-size:12.5px;font-weight:700;color:#B3261E\">{{ sv.total }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:4px 2px 0 20px;font-size:10.5px;color:#9A968C\">Writes {{ sv.target }}<\u002Fdiv>\n                <sc-for list=\"{{ sv.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;gap:8px;padding:2px 2px 0 20px;font-size:11px;color:#767267\">\n                    <span style=\"flex:none;width:96px;color:#1F2430;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ it.ref }}<\u002Fspan>\n                    <span style=\"flex:1;min-width:0\">{{ it.text }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showArchiveRow }}\">\n          <div style=\"flex:none;padding:9px 14px;border-top:1px solid #EEECE6;background:#FBFAF7;display:flex;align-items:center;gap:9px\">\n            <label style=\"display:flex;align-items:flex-start;gap:7px;flex:1;min-width:0;cursor:pointer\">\n              <input type=\"checkbox\" checked=\"{{ archiveOn }}\" sc-camel-on-change=\"{{ onToggleArchive }}\" style=\"width:14px;height:14px;flex:none;margin-top:1px;cursor:pointer\">\n              <span style=\"font-size:11.5px;color:#4A473F;line-height:1.45\">{{ archiveLine }}<\u002Fspan>\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ doChooseArchiveFolder }}\" title=\"By default the copies go into 04_Archived_Timeplans inside the timeplan folder\" style=\"{{ archiveBtnStyle }}\">{{ archiveBtnLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"flex:none;padding:11px 14px;border-top:1px solid #EEECE6;display:flex;align-items:center;gap:8px\">\n          <button sc-camel-on-click=\"{{ onSaveExcel }}\" disabled=\"{{ saveDisabled }}\" style=\"{{ saveConfirmStyle }}\">{{ saveConfirmLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ hasSaveRows }}\">\n            <button sc-camel-on-click=\"{{ onDiscardEdits }}\" title=\"Throw away every pending change and go back to what is in the files — click twice\" style=\"{{ discardStyle }}\">{{ discardLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelPlans }}\">\n      <div style=\"position:absolute;top:100%;right:20px;margin-top:-1px;z-index:300;width:480px;max-height:64vh;background:#FFFFFF;border:1px solid #D8D4CB;border-radius:10px;box-shadow:0 14px 34px rgba(31,36,48,0.16);display:flex;flex-direction:column;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:7px;padding:11px 13px;border-bottom:1px solid #EEECE6\">\n          <input type=\"text\" value=\"{{ planFilter }}\" sc-camel-on-input=\"{{ onPlanFilter }}\" sc-camel-on-change=\"{{ onPlanFilter }}\" placeholder=\"Filter timeplans…\" sc-camel-auto-complete=\"off\" sc-camel-spell-check=\"{{ false }}\" style=\"flex:1;min-width:0;padding:6px 9px;border:1px solid #D8D4CB;border-radius:7px;font-size:12px;font-family:inherit\">\n          <button sc-camel-on-click=\"{{ onShowAllPlans }}\" title=\"Show every timeplan\" style=\"padding:6px 10px;border:1px solid #D8D4CB;border-radius:7px;background:#FFFFFF;font-size:11.5px;font-weight:600;cursor:pointer;color:#4A473F;font-family:inherit\">Show all<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onHideAllPlans }}\" title=\"Hide every timeplan\" style=\"padding:6px 10px;border:1px solid #D8D4CB;border-radius:7px;background:#FFFFFF;font-size:11.5px;font-weight:600;cursor:pointer;color:#4A473F;font-family:inherit\">Hide all<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow:auto;padding:0 10px 12px\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:7px 4px 5px;border-bottom:1px solid #F1EFE9;position:sticky;top:0;background:#FFFFFF;z-index:2\">\n            <span style=\"width:170px;flex:none;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Show · file<\u002Fspan>\n            <span style=\"flex:1;min-width:0;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Timeplan name<\u002Fspan>\n            <span style=\"width:47px;flex:none;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Gutter<\u002Fspan>\n            <span title=\"Days since the owner last saved that file\" style=\"width:28px;flex:none;text-align:right;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Age<\u002Fspan>\n            <span title=\"Number of activities in that file\" style=\"width:26px;flex:none;text-align:right;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Acts<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ planRows }}\" as=\"pr\" hint-placeholder-count=\"6\">\n            <div>\n              <sc-if value=\"{{ pr.showGroup }}\">\n                <div style=\"padding:9px 4px 4px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B4B0A6\">{{ pr.groupLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"{{ pr.rowStyle }}\">\n                <label title=\"{{ pr.title }}\" style=\"display:flex;align-items:center;gap:8px;width:170px;flex:none;min-width:0;cursor:pointer\">\n                  <input type=\"checkbox\" checked=\"{{ pr.checked }}\" sc-camel-on-change=\"{{ pr.onToggle }}\" style=\"width:14px;height:14px;flex:none;cursor:pointer;accent-color:{{ pr.color }}\">\n                  <span style=\"{{ pr.swatchStyle }}\"><\u002Fspan>\n                  <span style=\"{{ pr.keyStyle }}\">{{ pr.label }}<\u002Fspan>\n                <\u002Flabel>\n                <input type=\"text\" value=\"{{ pr.nameValue }}\" sc-camel-on-input=\"{{ pr.onNameChange }}\" sc-camel-on-change=\"{{ pr.onNameChange }}\" placeholder=\"Plan name\" title=\"{{ pr.nameTitle }}\" sc-camel-auto-complete=\"off\" sc-camel-spell-check=\"{{ false }}\" style=\"{{ pr.inputStyle }}\">\n                <label title=\"Show this plan name beside the level in the master view\" style=\"display:flex;align-items:center;gap:4px;flex:none;font-size:10.5px;color:#9A968C;cursor:pointer\">\n                  <input type=\"checkbox\" checked=\"{{ pr.nameChecked }}\" sc-camel-on-change=\"{{ pr.onNameToggle }}\" style=\"width:13px;height:13px;cursor:pointer\">\n                  <span>label<\u002Fspan>\n                <\u002Flabel>\n                <span title=\"{{ pr.staleTitle }}\" style=\"{{ pr.staleStyle }}\">{{ pr.staleLabel }}<\u002Fspan>\n                <span style=\"font-size:10.5px;color:#B4B0A6;flex:none;width:26px;text-align:right\">{{ pr.count }}<\u002Fspan>\n                <sc-if value=\"{{ pr.hasBadge }}\">\n                  <span title=\"{{ pr.badgeTitle }}\" style=\"{{ pr.badgeStyle }}\">{{ pr.badgeLabel }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noPlanMatches }}\">\n            <div style=\"padding:16px;text-align:center;font-size:12px;color:#9A968C\">No timeplan matches that filter.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"margin-top:10px;padding-top:9px;border-top:1px solid #F1EFE9;font-size:10.5px;color:#9A968C;line-height:1.6\">\n            <b>Show · file<\u002Fb> ticks the timeplan on or off in the master view. <b>Timeplan name<\u002Fb> is the name stored in the file — typing here is saved back to Excel. <b>Gutter<\u002Fb> shows that name beside the level on the master plan and in exports. <b>Age<\u002Fb> is days since the owner last saved the file: green fresh, amber over {{ staleDaysLabel }} days, red over {{ staleDaysDoubleLabel }}. <b>Acts<\u002Fb> is how many activities the file holds. A round amber or red badge is that file’s warning count — open <b>Warnings<\u002Fb> to read them.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelHealth }}\">\n      <div style=\"position:absolute;top:100%;right:20px;margin-top:-1px;z-index:300;width:520px;max-height:66vh;background:#FFFFFF;border:1px solid #D8D4CB;border-radius:10px;box-shadow:0 14px 34px rgba(31,36,48,0.16);display:flex;flex-direction:column;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #EEECE6\">\n          <span style=\"font-size:12.5px;font-weight:700;color:#1F2430\">{{ healthTitle }}<\u002Fspan>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ doPickFiles }}\" title=\"Load one file on its own to check it before it goes into the shared folder\" style=\"padding:6px 10px;border:1px solid #D8D4CB;border-radius:7px;background:#FFFFFF;font-size:11.5px;font-weight:600;cursor:pointer;color:#4A473F;font-family:inherit\">Check a file…<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ healthAny }}\">\n          <div style=\"display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid #EEECE6;background:#FCFBF8\">\n            <sc-for list=\"{{ sevTabs }}\" as=\"sv\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ sv.onClick }}\" style=\"{{ sv.style }}\">{{ sv.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <sc-raw-select value=\"{{ healthPlanValue }}\" sc-camel-on-change=\"{{ onHealthPlan }}\" title=\"Show warnings for one timeplan only\" style=\"max-width:170px;padding:5px 7px;border:1px solid #D8D4CB;border-radius:6px;font-size:11px;font-family:inherit;background:#FFFFFF;color:#1F2430\">\n              <sc-for list=\"{{ healthPlanOptions }}\" as=\"ho\" hint-placeholder-count=\"3\">\n                <option value=\"{{ ho.value }}\">{{ ho.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"flex:1;overflow:auto;padding:4px 14px 14px\">\n          <sc-if value=\"{{ healthClean }}\">\n            <div style=\"padding:16px 4px;font-size:12px;color:#1E8449;line-height:1.5\">Nothing to flag. Every timeplan has been updated recently, all weeks and years are valid, and every dependency resolves.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ healthFilteredEmpty }}\">\n            <div style=\"padding:18px 4px;font-size:12px;color:#9A968C;line-height:1.5\">Nothing matches that filter.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ healthRows }}\" as=\"hr\" hint-placeholder-count=\"5\">\n            <div>\n              <sc-if value=\"{{ hr.showGroup }}\">\n                <div style=\"padding:12px 0 5px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B4B0A6\">{{ hr.groupLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:9px;padding:3px 0;align-items:flex-start\">\n                <span style=\"{{ hr.dotStyle }}\"><\u002Fspan>\n                <span style=\"font-size:11.5px;color:#4A473F;line-height:1.5\">{{ hr.msg }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"margin-top:14px;padding-top:11px;border-top:1px solid #EEECE6;font-size:11px;color:#767267;line-height:1.65\">\n            <div style=\"font-weight:700;color:#1F2430;font-size:11.5px;margin-bottom:4px\">How to write a dependency<\u002Fdiv>\n            <div>In the <b>Dependencies<\u002Fb> column of the input sheet, write the <b>file name<\u002Fb>, a hyphen, then the <b>No.<\u002Fb> of the activity this one waits for:<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#1F2430;background:#F7F6F2;border-radius:5px;padding:6px 8px;margin:5px 0\">L1_Programme-14; L3_Tooling-7<\u002Fdiv>\n            <div>Separate several with a semicolon. Instead of the No. you may write the activity name (<span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;color:#1F2430\">L1_Programme-Gate 2 review<\u002Fspan>), and a bare No. or name with no prefix means “in this same file”. <b>The No. is the safe form<\u002Fb> — it is matched first and can never be ambiguous, and every activity’s exact reference is printed in the <b>Ref<\u002Fb> column of its own timeplan tab, ready to copy. Anything that does not match is listed above and drawn as a red chip on the plan page — a typo is never silently dropped.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelBaseline }}\">\n      <div style=\"position:absolute;top:100%;right:20px;margin-top:-1px;z-index:300;width:440px;max-height:74vh;background:#FFFFFF;border:1px solid #D8D4CB;border-radius:10px;box-shadow:0 14px 34px rgba(31,36,48,0.16);display:flex;flex-direction:column;overflow:auto\">\n        <div style=\"flex:none;padding:14px 14px 13px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #EEECE6\">\n          <span style=\"font-size:12.5px;font-weight:700;color:#1F2430\">Baseline — what has moved since<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#767267;line-height:1.6\">Pressing <b>Capture<\u002Fb> freezes the start and end week of every activity in every loaded file, exactly as they are right now, and stores it as a dated snapshot. <b>Nothing on the plan moves and nothing is written into the timeplans.<\u002Fb><\u002Fspan>\n          <span style=\"font-size:11.5px;color:#767267;line-height:1.6\">Afterwards, when an owner shifts an activity in their file, switching <b>Baseline view<\u002Fb> on shows the difference: a dashed outline where the activity used to sit, and a badge for how far it moved — <span style=\"color:#B3261E;font-weight:700\">+3w<\u002Fspan> is three weeks later, <span style=\"color:#1E8449;font-weight:700\">−2w<\u002Fspan> is two weeks earlier. Activities nobody touched are drawn normally. That is the whole feature: capture, then compare.<\u002Fspan>\n          <button sc-camel-on-click=\"{{ onTakeBaseline }}\" style=\"{{ captureStyle }}\">{{ captureLabel }}<\u002Fbutton>\n          <span style=\"font-size:11px;color:#9A968C;line-height:1.5\">Saved as <b>{{ baselineDirLabel }}<\u002Fb> beside the timeplans, so everyone opening the folder compares against the same snapshot. Press it as often as you like — every capture is kept and named by month, numbered if there is more than one in a month.<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasBaselines }}\">\n          <div style=\"flex:none;padding:13px 14px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid #EEECE6\">\n            <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C\">Compare<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <sc-raw-select value=\"{{ baselineValue }}\" sc-camel-on-change=\"{{ onPickBaseline }}\" title=\"The frozen snapshot to measure from\" style=\"flex:1;min-width:0;padding:7px 8px;border:1px solid #D8D4CB;border-radius:7px;font-size:12px;font-family:inherit;background:#FFFFFF;color:#1F2430\">\n                <sc-for list=\"{{ baselineList }}\" as=\"bl\" hint-placeholder-count=\"2\">\n                  <option value=\"{{ bl.value }}\">{{ bl.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <span style=\"flex:none;font-size:13px;color:#9A968C\">→<\u002Fspan>\n              <sc-raw-select value=\"{{ baselineToValue }}\" sc-camel-on-change=\"{{ onPickBaselineTo }}\" title=\"Measure to today's live plan, or to a second capture\" style=\"flex:1;min-width:0;padding:7px 8px;border:1px solid #D8D4CB;border-radius:7px;font-size:12px;font-family:inherit;background:#FFFFFF;color:#1F2430\">\n                <sc-for list=\"{{ baselineToOptions }}\" as=\"bt\" hint-placeholder-count=\"2\">\n                  <option value=\"{{ bt.value }}\">{{ bt.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <sc-if value=\"{{ comparingTwo }}\">\n              <span style=\"font-size:11px;color:#8A5A00;background:#FFF4E0;border-radius:6px;padding:6px 8px;line-height:1.45\">Comparing two captures. The bars still show today’s plan — the dashed outline and the badge show the move between the two snapshots.<\u002Fspan>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ onToggleShowBaseline }}\" title=\"Draw the baseline position as a dashed outline behind each bar, with the movement badge\" style=\"{{ baseToggleBtnStyle }}\">\n              <span style=\"{{ baseKnobTrackStyle }}\"><span style=\"{{ baseKnobStyle }}\"><\u002Fspan><\u002Fspan>\n              <span>{{ baseToggleLabel }}<\u002Fspan>\n            <\u002Fbutton>\n            <span style=\"font-size:11.5px;color:#767267;line-height:1.5\">{{ baselineSummary }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasSlipRows }}\">\n          <div style=\"flex:1;overflow:auto;padding:8px 14px 14px\">\n            <div style=\"padding:4px 0 6px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B4B0A6\">Largest move per timeplan<\u002Fdiv>\n            <sc-for list=\"{{ slipRows }}\" as=\"sr\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:4px 0\">\n                <span style=\"{{ sr.swatchStyle }}\"><\u002Fspan>\n                <span style=\"font-size:11px;font-weight:600;color:#1F2430;flex:none;width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ sr.planKey }}<\u002Fspan>\n                <span style=\"font-size:11px;color:#4A473F;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ sr.label }}<\u002Fspan>\n                <span style=\"{{ sr.slipStyle }}\">{{ sr.slip }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelView }}\">\n      <div style=\"position:absolute;top:100%;right:20px;margin-top:-1px;z-index:300;width:340px;background:#FFFFFF;border:1px solid #D8D4CB;border-radius:10px;box-shadow:0 14px 34px rgba(31,36,48,0.16);padding:14px;display:flex;flex-direction:column;gap:13px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C\">Timeline scale<\u002Fspan>\n          <button sc-camel-on-click=\"{{ onToggleCompact }}\" title=\"Compact the timeline (1 week = 1/4 cell) — good for long date ranges and exports\" style=\"{{ compactBtnStyle }}\">\n            <span style=\"{{ compactKnobTrackStyle }}\"><span style=\"{{ compactKnobStyle }}\"><\u002Fspan><\u002Fspan>\n            <span>Compact — 1 week = ¼ cell<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:#EEECE6\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C\">Columns<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n            <sc-for list=\"{{ columnToggles }}\" as=\"ct\" hint-placeholder-count=\"3\">\n              <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:#4A473F\">\n                <input type=\"checkbox\" checked=\"{{ ct.checked }}\" sc-camel-on-change=\"{{ ct.onToggle }}\" style=\"width:14px;height:14px;cursor:pointer\">\n                <span>{{ ct.label }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:#EEECE6\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C\">Snapshot window<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:5px;font-size:11.5px;color:#767267\">\n            <input type=\"number\" value=\"{{ cropStartWk }}\" sc-camel-on-change=\"{{ onCropStartWk }}\" title=\"Start week\" style=\"width:44px;padding:5px 4px;border:1px solid #D8D4CB;border-radius:5px;font-size:12px;font-family:inherit\">\n            <span>/<\u002Fspan>\n            <input type=\"number\" value=\"{{ cropStartYr }}\" sc-camel-on-change=\"{{ onCropStartYr }}\" title=\"Start year\" style=\"width:58px;padding:5px 4px;border:1px solid #D8D4CB;border-radius:5px;font-size:12px;font-family:inherit\">\n            <span>→<\u002Fspan>\n            <input type=\"number\" value=\"{{ cropEndWk }}\" sc-camel-on-change=\"{{ onCropEndWk }}\" title=\"End week\" style=\"width:44px;padding:5px 4px;border:1px solid #D8D4CB;border-radius:5px;font-size:12px;font-family:inherit\">\n            <span>/<\u002Fspan>\n            <input type=\"number\" value=\"{{ cropEndYr }}\" sc-camel-on-change=\"{{ onCropEndYr }}\" title=\"End year\" style=\"width:58px;padding:5px 4px;border:1px solid #D8D4CB;border-radius:5px;font-size:12px;font-family:inherit\">\n            <button sc-camel-on-click=\"{{ onResetCrop }}\" title=\"Reset to the global min/max across every loaded timeplan\" style=\"padding:5px 9px;border:1px solid #D8D4CB;border-radius:5px;background:#FFFFFF;font-size:11.5px;cursor:pointer;color:#767267;font-family:inherit\">Reset<\u002Fbutton>\n          <\u002Fdiv>\n          <span style=\"font-size:11px;color:#9A968C;line-height:1.45\">Crops the view and every export to this week range.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelExport }}\">\n      <div style=\"position:absolute;top:100%;right:20px;margin-top:-1px;z-index:300;width:260px;background:#FFFFFF;border:1px solid #D8D4CB;border-radius:10px;box-shadow:0 14px 34px rgba(31,36,48,0.16);padding:12px;display:flex;flex-direction:column;gap:7px\">\n        <button sc-camel-on-click=\"{{ doDownloadSVG }}\" style=\"padding:8px 12px;border:none;border-radius:7px;background:#1F3864;color:#FFFFFF;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left\">Download SVG<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ doDownloadPNG }}\" style=\"padding:8px 12px;border:none;border-radius:7px;background:#1F3864;color:#FFFFFF;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left\">Download PNG<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ doExportPDF }}\" style=\"padding:8px 12px;border:1px solid #1F3864;border-radius:7px;background:#FFFFFF;color:#1F3864;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left\">Export PDF<\u002Fbutton>\n        <span style=\"font-size:11px;color:#9A968C;line-height:1.45;padding:2px 2px 0\">Exports contain the visible timeplans within the snapshot window.<\u002Fspan>\n        <div style=\"height:1px;background:#EEECE6;margin:4px 0\"><\u002Fdiv>\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C;padding:0 2px\">Status sheets<\u002Fspan>\n        <span style=\"font-size:11px;color:#9A968C;line-height:1.45;padding:0 2px 2px\">One printable A4 page per timeplan for reviews: header block, every activity with its dates, status, dependencies and movement against the baseline, that plan’s warnings, and a sign-off line.<\u002Fspan>\n        <button sc-camel-on-click=\"{{ doPrintStatusAll }}\" style=\"padding:8px 12px;border:1px solid #1F3864;border-radius:7px;background:#FFFFFF;color:#1F3864;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left\">Print all timeplans<\u002Fbutton>\n        <sc-if value=\"{{ onPlanTab }}\">\n          <button sc-camel-on-click=\"{{ doPrintStatusCurrent }}\" style=\"padding:8px 12px;border:1px solid #1F3864;border-radius:7px;background:#FFFFFF;color:#1F3864;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left\">Print {{ currentPlanKey }} only<\u002Fbutton>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ doSaveStatusAll }}\" style=\"padding:8px 12px;border:1px solid #D8D4CB;border-radius:7px;background:#FFFFFF;color:#4A473F;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left\">Save status sheets as file<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelImpact }}\">\n      <div style=\"position:absolute;top:100%;right:20px;margin-top:-1px;z-index:300;width:560px;max-height:74vh;background:#FFFFFF;border:1px solid #D8D4CB;border-radius:10px;box-shadow:0 14px 34px rgba(31,36,48,0.16);display:flex;flex-direction:column;overflow:hidden\">\n        <div style=\"flex:none;padding:13px 14px 11px;border-bottom:1px solid #EEECE6;display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:12.5px;font-weight:700;color:#1F2430\">Knock-on effects<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#767267;line-height:1.55\">{{ impactIntro }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ impactHasChanges }}\">\n          <div style=\"flex:none;padding:10px 14px;border-bottom:1px solid #EEECE6;background:#FCFBF8\">\n            <div style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C;margin-bottom:6px\">What moved<\u002Fdiv>\n            <sc-for list=\"{{ impactChangeRows }}\" as=\"ic\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11.5px\">\n                <span style=\"{{ ic.swatchStyle }}\"><\u002Fspan>\n                <span style=\"flex:none;width:104px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:#4A473F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ic.display }}<\u002Fspan>\n                <span style=\"flex:1;min-width:0;color:#1F2430;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ic.name }}<\u002Fspan>\n                <span style=\"flex:none;color:#767267;font-size:11px\">{{ ic.move }}<\u002Fspan>\n                <span style=\"{{ ic.deltaStyle }}\">{{ ic.deltaText }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"flex:1;overflow:auto;padding:0 14px 12px\">\n          <sc-if value=\"{{ impactHasRows }}\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:8px 0 5px;position:sticky;top:0;background:#FFFFFF;border-bottom:1px solid #F1EFE9;z-index:2\">\n              <span style=\"width:104px;flex:none;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Affected<\u002Fspan>\n              <span style=\"flex:1;min-width:0;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Activity<\u002Fspan>\n              <span style=\"width:96px;flex:none;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Now runs<\u002Fspan>\n              <span style=\"width:118px;flex:none;font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#B4B0A6\">Action<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ impactRowsView }}\" as=\"ir\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #F6F5F1\">\n                <span style=\"flex:none;width:104px;display:flex;align-items:center;gap:6px;min-width:0\">\n                  <span style=\"{{ ir.swatchStyle }}\"><\u002Fspan>\n                  <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:#4A473F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ir.display }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:1px\">\n                  <span style=\"font-size:11.5px;color:#1F2430;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ir.name }}<\u002Fspan>\n                  <span style=\"font-size:10px;color:#9A968C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ir.because }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"width:96px;flex:none;font-size:11px;color:#767267\">{{ ir.range }}<\u002Fspan>\n                <span style=\"{{ ir.verdictStyle }}\">{{ ir.verdict }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ impactEmpty }}\">\n            <div style=\"padding:18px 2px;font-size:12px;color:#9A968C;line-height:1.55\">{{ impactEmptyText }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #EEECE6;font-size:10.5px;color:#9A968C;line-height:1.6\">This follows the links written in the <b>Dependencies<\u002Fb> column, and only those. An activity nobody recorded a dependency for will never appear here, however obviously it is affected. Nothing is changed automatically — this is a list to work through.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:11px 14px;border-top:1px solid #EEECE6;display:flex;gap:8px\">\n          <button sc-camel-on-click=\"{{ doPrintImpact }}\" disabled=\"{{ impactDisabled }}\" style=\"{{ impactPrintStyle }}\">Print report<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ doSaveImpact }}\" disabled=\"{{ impactDisabled }}\" style=\"{{ impactSaveStyle }}\">Save report as file<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ error }}\">\n    <div style=\"flex:none;padding:9px 20px;background:#FDECEA;color:#B3261E;font-size:12.5px\">{{ error }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ warning }}\">\n    <div style=\"flex:none;padding:9px 20px;background:#FFF4E0;color:#8A5A00;font-size:12.5px\">{{ warning }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ notice }}\">\n    <div style=\"flex:none;padding:9px 20px;background:#EEF3FA;color:#1F3864;font-size:12.5px\">{{ notice }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showMaster }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;overflow:auto;position:relative;background:#FFFFFF\">\n      <div style=\"position:sticky;top:0;left:0;z-index:70;height:{{ infoBarHeight }}px;background:#FCFBF8;border-bottom:2px solid #1F2430;display:flex;align-items:stretch;padding:0;overflow:hidden\">\n        <div style=\"width:6px;flex:none;background:{{ hdrAccent }}\"><\u002Fdiv>\n        <sc-if value=\"{{ hdrView }}\">\n          <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:22px;padding:10px 16px\">\n            <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\">\n              <span style=\"font-size:19px;font-weight:700;letter-spacing:-0.3px;color:#1F2430;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ hdr.title }}<\u002Fspan>\n              <sc-if value=\"{{ hdrHasDescription }}\">\n                <span style=\"font-size:11px;color:#767267;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ hdr.description }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"flex:none;display:flex;align-items:stretch;gap:0\">\n              <sc-for list=\"{{ hdrFacts }}\" as=\"hf\" hint-placeholder-count=\"4\">\n                <div style=\"padding:0 16px;border-left:1px solid #E4E1DA;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:88px\">\n                  <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#A8A498\">{{ hf.label }}<\u002Fspan>\n                  <span style=\"{{ hf.valueStyle }}\">{{ hf.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onHdrEdit }}\" title=\"Type your own programme title, code, SoP and description for this dashboard and every export\" style=\"flex:none;margin-left:4px;padding:6px 11px;border:1px solid #D8D4CB;border-radius:7px;background:#FFFFFF;font-size:11.5px;font-weight:600;cursor:pointer;color:#4A473F;font-family:inherit\">Edit heading<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hdrEdit }}\">\n          <div style=\"flex:1;min-width:0;padding:11px 16px;display:flex;flex-direction:column;gap:9px\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A968C\">Heading for this dashboard and every export<\u002Fspan>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ onHdrReset }}\" title=\"Go back to the values in the L1 timeplan file\" style=\"padding:5px 10px;border:1px solid #D8D4CB;border-radius:6px;background:#FFFFFF;font-size:11px;font-weight:600;cursor:pointer;color:#767267;font-family:inherit\">Reset to file<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onHdrDone }}\" style=\"padding:5px 12px;border:none;border-radius:6px;background:#1F2430;color:#FFFFFF;font-size:11
